// SCENE INIT
// =============================================================
function loadScene(id) {
  const scene = GAME_DATA.scenes[id];
  if (!scene) return;
  gameState.currentScene = id;
  gameState.visited.add(id);

  document.getElementById('loc-name').textContent = scene.name;
  document.getElementById('loc-sub').textContent  = scene.subtitle;
  document.getElementById('loc-act').textContent  = scene.actLabel;
  document.getElementById('nb-loc').textContent   = scene.name + ' · ' + scene.actLabel;

  // Clear the previous scene's handlers first: a cached image still fires a
  // late load event, which would otherwise rebuild the old scene's hotspots.
  const img = document.getElementById('scene-image');
  img.onload = img.onerror = null;
  img.src = scene.image;
  const build = () => {
    if (gameState.currentScene !== id) return;
    computeBounds();
    buildHotspots(scene);
  };
  if (img.complete && img.naturalWidth) {
    build();
  } else {
    img.onload = build;
    img.onerror = build;
  }

  checkReportTab();
  checkReportReady();

  const btn  = document.getElementById('progress-btn');
  const prog = scene.progression || {};
  btn.textContent = prog.buttonText || '';
  btn.classList.remove('show');
  checkProgression();
}

// =============================================================
// HOTSPOTS
// =============================================================
// A hotspot with requires:[ids] stays hidden until every id has been discovered.
// Optional background cards: trivia, and ambient objects that open no doorway.
// They get a pale blue light and a 'Roman Life' tag so slower readers can skip them.
// Conversations are never marked optional.
function isExtra(h) {
  if (h.type === 'navigation' || h.type === 'dialogue' || h.goto || h.transition) return false;
  return h.kind === 'trivial' || h.kind === 'ambiance';
}

function hotspotAvailable(h) {
  return !h.requires || h.requires.every(id => gameState.discovered.has(id));
}

function refreshHotspots() {
  const scene = GAME_DATA.scenes[gameState.currentScene];
  if (!scene) return;
  scene.hotspots.forEach(h => {
    const el = document.querySelector(`.hotspot[data-id="${h.id}"]`);
    if (!el) return;
    const show = hotspotAvailable(h);
    if (show && el.style.display === 'none') {
      el.style.display = '';
      el.classList.add('reveal');
    } else if (!show) {
      el.style.display = 'none';
    }
  });
}

function buildHotspots(scene) {
  const layer = document.getElementById('hotspot-layer');
  layer.innerHTML = '';
  scene.hotspots.forEach(h => {
    if (h.dev && !DEV_TOOLS) return;
    const isNav = h.type === 'navigation';
    const el = document.createElement('div');
    el.className = isNav
      ? 'hotspot nav-hotspot'
      : 'hotspot' + (isExtra(h) ? ' extra' : '') + (gameState.discovered.has(h.id) ? ' found' : '');
    if (!hotspotAvailable(h)) el.style.display = 'none';
    el.dataset.id = h.id;
    el.style.left  = (h.x * 100) + '%';
    el.style.top   = (h.y * 100) + '%';
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', h.label);

    const glow = document.createElement('div');
    glow.className = 'hotspot-glow';
    el.appendChild(glow);

    if (isNav) {
      // Always-visible direction label
      const lbl = document.createElement('div');
      lbl.className = 'hotspot-nav-label';
      lbl.textContent = h.label;
      el.appendChild(lbl);
      el.addEventListener('click',   e => { e.stopPropagation(); if (!pan.moved) goToScene(h.goto, h.label); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToScene(h.goto, h.label); } });
    } else {
      el.title = h.label;
      el.addEventListener('click',   e => { e.stopPropagation(); if (!pan.moved) openCard(h.id); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(h.id); } });
    }

    layer.appendChild(el);
  });
}

// =============================================================
// EVIDENCE CARD
// =============================================================
// Looks in the current scene first, then anywhere else, so notebook entries
// from earlier scenes can still be reopened.
function findHotspot(id) {
  const here  = GAME_DATA.scenes[gameState.currentScene];
  const local = here.hotspots.find(x => x.id === id);
  if (local) return { h: local, scene: here, local: true };
  for (const sid of Object.keys(GAME_DATA.scenes)) {
    const s = GAME_DATA.scenes[sid];
    const h = s.hotspots.find(x => x.id === id && x.type !== 'navigation');
    if (h) return { h, scene: s, local: false };
  }
  return null;
}

function markDiscovered(h) {
  gameState.discovered.add(h.id);
  (h.grants || []).forEach(flag => gameState.discovered.add(flag));
}

function openCard(id) {
  const found = findHotspot(id);
  if (!found) return;
  const { h, scene, local } = found;

  const isNew = local && !gameState.discovered.has(id);
  if (isNew) {
    markDiscovered(h);
    const el = document.querySelector(`.hotspot[data-id="${id}"]`);
    if (el) el.classList.add('found');
    if (h.type === 'dialogue') {
      addPerson(h, scene);
    } else {
      addEvidence(h, scene);
    }
    checkProgression();
  }

  gameState.cardOpen = true;

  const card    = document.getElementById('evidence-card');
  const inner   = document.getElementById('card-inner');
  const added   = document.getElementById('card-added');
  const overlay = document.getElementById('card-overlay');

  card.className = 'type-' + h.type;
  added.classList.remove('show');

  const typeLabel = { dialogue: 'Conversation', document: 'Document', object: 'Observation' };
  const extra = isExtra(h);
  card.classList.toggle('is-extra', extra);
  const tag = h.content.tag || (extra ? 'Roman Life \u00b7 Optional' : typeLabel[h.type] || h.type);
  let html = `<span class="card-type-tag">${esc(tag)}</span>`;
  html += `<div class="card-title">${esc(h.content.title)}</div>`;

  if (h.type === 'dialogue') {
    if (h.content.desc) html += `<div class="card-desc">${esc(h.content.desc)}</div>`;
    html += '<hr class="card-rule">';
    // A line is a string, or { who, text } when the card overhears more than one speaker.
    // The speaker's name is shown only when the voice changes.
    let lastWho = null;
    (h.content.lines || []).forEach(l => {
      const who  = l.who && l.who !== lastWho ? `<span class="card-speaker">${esc(l.who)}</span>` : '';
      const text = typeof l === 'string' ? l : l.text;
      lastWho = l.who || null;
      html += `<div class="card-line">${who}&ldquo;${esc(text)}&rdquo;</div>`;
    });
  } else {
    html += '<hr class="card-rule">';
    html += `<div class="card-body">${esc(h.content.text || '')}</div>`;
  }
  if (h.content.note) html += `<div class="card-goto-note">${esc(h.content.note)}</div>`;

  // Doorways only work from the scene you are standing in, and not once the report is filed.
  const canAct = local && !gameState.reportFiled;
  if (canAct && h.transition) {
    html += `<button class="card-transition-btn" onclick="closeCard();doProgression();">${esc(scene.progression.buttonText)}</button>`;
  }
  if (canAct && h.goto && GAME_DATA.scenes[h.goto]) {
    const missing = (h.gotoRequires || []).find(r => !gameState.discovered.has(r));
    if (!missing) {
      if (h.gotoNote) html += `<div class="card-goto-note">${esc(h.gotoNote)}</div>`;
      html += `<button class="card-transition-btn" onclick="closeCard();goToScene('${h.goto}');">${esc(h.gotoText || 'Go')}</button>`;
    } else {
      const hint = typeof h.gotoLocked === 'string' ? h.gotoLocked : (h.gotoLocked || {})[missing];
      if (hint) html += `<div class="card-goto-locked">${esc(hint)}</div>`;
    }
  }

  inner.innerHTML = html;
  overlay.classList.add('open');
  if (isNew) setTimeout(() => added.classList.add('show'), 200);
  setTimeout(() => document.getElementById('card-close').focus(), 80);
}

function closeCard() {
  gameState.cardOpen = false;
  document.getElementById('card-overlay').classList.remove('open');
  refreshHotspots();
}

const POI_LABELS = ['No concern', 'Worth watching', 'Person of interest'];

function notebookBadgeCount() {
  return Object.keys(gameState.people).length + gameState.evidence.length;
}

function addEvidence(h, scene) {
  if (gameState.evidence.find(e => e.id === h.id)) return;
  gameState.evidence.push({ id: h.id, title: h.content.title || h.label, type: h.type, sceneName: scene.name });
  document.getElementById('nb-badge').textContent = notebookBadgeCount();
  renderNotebook();
}

function addPerson(h, scene) {
  const names = (h.content.people && h.content.people.length) ? h.content.people : [h.label];
  const noPoi = !!(h.noPoi || h.content.noPoi);
  names.forEach(name => {
    // Meeting someone again points their notebook entry at the newest conversation.
    const existing = Object.values(gameState.people).find(p => p.name === name);
    if (existing) {
      existing.hotspotId = h.id;
      existing.sceneName = scene.name;
      return;
    }
    const key = h.id + '__' + name.replace(/\s+/g, '_');
    gameState.people[key] = { id: key, hotspotId: h.id, name, sceneName: scene.name, poi: 0, notes: '', noPoi };
  });
  document.getElementById('nb-badge').textContent = notebookBadgeCount();
  renderNotebook();
}

function renderNotebook() {
  // People section
  const peopleContainer = document.getElementById('nb-people');
  peopleContainer.innerHTML = '';
  const peopleKeys = Object.keys(gameState.people);
  peopleKeys.forEach(key => {
    const person = gameState.people[key];
    const el = document.createElement('div');
    el.className = 'nb-person-card';

    // Name (clickable)
    const nameBtn = document.createElement('button');
    nameBtn.className = 'nb-person-name';
    nameBtn.textContent = person.name;
    nameBtn.addEventListener('click', () => {
      if (isDesktopDocked()) {
        openCard(person.hotspotId);
      } else {
        toggleNotebook();
        setTimeout(() => openCard(person.hotspotId), 340);
      }
    });

    // POI slider
    const sliderWrap = document.createElement('div');
    sliderWrap.className = 'nb-poi-wrap';
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '0'; slider.max = '2'; slider.step = '1';
    slider.value = String(person.poi);
    slider.className = 'nb-poi-slider';
    const poiLabel = document.createElement('div');
    poiLabel.className = 'nb-poi-label';
    poiLabel.textContent = POI_LABELS[person.poi];
    slider.addEventListener('input', () => {
      person.poi = parseInt(slider.value, 10);
      poiLabel.textContent = POI_LABELS[person.poi];
      gameState.people[key].poi = person.poi;
    });
    sliderWrap.appendChild(slider);
    sliderWrap.appendChild(poiLabel);

    // Notes textarea
    const notes = document.createElement('textarea');
    notes.className = 'nb-notes';
    notes.placeholder = 'Your notes...';
    notes.rows = 2;
    notes.value = person.notes;
    notes.addEventListener('input', () => {
      gameState.people[key].notes = notes.value;
    });

    el.appendChild(nameBtn);
    if (!person.noPoi) el.appendChild(sliderWrap);
    el.appendChild(notes);
    peopleContainer.appendChild(el);
  });

  // Evidence section
  const evContainer = document.getElementById('nb-evidence');
  evContainer.innerHTML = '';
  gameState.evidence.forEach(entry => {
    const el  = document.createElement('div');
    el.className = 'nb-entry';
    const dot = document.createElement('div');
    dot.className = `nb-dot ${entry.type}`;
    const info = document.createElement('div');
    info.className = 'nb-info';
    info.innerHTML = `<div class="nb-title">${esc(entry.title)}</div><div class="nb-type">${entry.type}</div>`;
    el.appendChild(dot);
    el.appendChild(info);
    el.addEventListener('click', () => {
      if (isDesktopDocked()) {
        openCard(entry.id);
      } else {
        toggleNotebook();
        setTimeout(() => openCard(entry.id), 340);
      }
    });
    evContainer.appendChild(el);
  });

  // Show/hide empty state and sections
  const empty = document.getElementById('nb-empty');
  const hasAny = peopleKeys.length > 0 || gameState.evidence.length > 0;
  if (empty) empty.style.display = hasAny ? 'none' : '';
  const pSection = document.getElementById('nb-people-section');
  if (pSection) pSection.style.display = peopleKeys.length > 0 ? '' : 'none';
  const eSection = document.getElementById('nb-evidence-section');
  if (eSection) eSection.style.display = gameState.evidence.length > 0 ? '' : 'none';

  checkReportTab();
  checkReportReady();
}

const REPORT_KEYS = ['who', 'what', 'where', 'when', 'why'];

function updateReport(key, value) {
  gameState.report[key] = value;
  checkReportReady();
}

function reportInvestigationDone() {
  return (GAME_DATA.report.requires || []).every(id => gameState.discovered.has(id) || gameState.visited.has(id));
}

function reportFieldsComplete() {
  return REPORT_KEYS.every(k => (gameState.report[k] || '').trim().length > 0);
}

function checkReportReady() {
  const btn = document.getElementById('report-submit');
  const cap = document.getElementById('report-caption');
  if (!btn || !cap) return;
  if (gameState.reportFiled) {
    btn.disabled = true;
    btn.textContent = 'Report Filed';
    cap.textContent = GAME_DATA.report.filedCaption;
    return;
  }
  const done = reportInvestigationDone();
  const full = reportFieldsComplete();
  btn.disabled = !(done && full);
  const R = GAME_DATA.report;
  cap.textContent = !done ? R.lockedCaption : !full ? R.fieldsCaption : R.readyCaption;
}

// The gold dot marks news on the report: once when the tab opens up, again when it can be filed.
function setReportDot(on) {
  document.getElementById('nb-report-dot').style.display = on ? '' : 'none';
  document.getElementById('nb-toggle').classList.toggle('has-news', on);
}

function checkReportTab() {
  const tab = document.getElementById('tab-report');
  if (!tab) return;
  const unlocked = gameState.discovered.has(GAME_DATA.report.unlock);
  tab.style.display = unlocked ? '' : 'none';
  const milestone = !unlocked ? 0 : reportInvestigationDone() ? 2 : 1;
  if (milestone > gameState.reportMilestone) {
    gameState.reportMilestone = milestone;
    if (gameState.notebookTab !== 'report') setReportDot(true);
  }
}

function syncReportFields() {
  ['who','what','where','when','why'].forEach(k => {
    const el = document.getElementById('report-' + k);
    if (el) el.value = gameState.report[k] || '';
  });
}

function switchTab(tab) {
  gameState.notebookTab = tab;
  document.querySelectorAll('.nb-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  const notesArea  = document.getElementById('nb-scroll-area');
  const reportArea = document.getElementById('nb-report-area');
  if (tab === 'report') {
    notesArea.style.display  = 'none';
    reportArea.style.display = 'block';
    setReportDot(false);
    syncReportFields();
  } else {
    notesArea.style.display  = '';
    reportArea.style.display = 'none';
  }
}

function toggleNotebook() {
  if (isDesktopDocked()) return; // on desktop it's always visible
  gameState.notebookOpen = !gameState.notebookOpen;
  document.getElementById('notebook').classList.toggle('open', gameState.notebookOpen);
}

// =============================================================
// PROGRESSION
// =============================================================
function checkProgression() {
  const scene = GAME_DATA.scenes[gameState.currentScene];
  const prog  = scene.progression;
  if (!prog || !prog.required || prog.required.length === 0) {
    document.getElementById('progress-btn').classList.remove('show');
    return;
  }
  const met = prog.required.every(id => gameState.discovered.has(id));
  document.getElementById('progress-btn').classList.toggle('show', met);
}

function runTransition(act, title, sub, midFn, endMs) {
  const overlay = document.getElementById('transition');
  const inner   = document.getElementById('trans-inner');
  inner.querySelector('.trans-act').textContent   = act   || '';
  inner.querySelector('.trans-title').textContent = title || '';
  inner.querySelector('.trans-sub').textContent   = sub   || '';
  overlay.classList.add('on');
  if (midFn) setTimeout(midFn, 900);
  setTimeout(() => overlay.classList.remove('on'), endMs || 2200);
}

function goToScene(targetId, fallbackLabel) {
  const target = GAME_DATA.scenes[targetId];
  if (target) {
    runTransition(target.actLabel, target.name, target.subtitle, () => { loadScene(targetId); setPan(0, false); });
  } else {
    runTransition('Coming Soon', fallbackLabel || 'Next Scene', '', null, 2800);
  }
}

function doProgression() {
  const scene = GAME_DATA.scenes[gameState.currentScene];
  const prog  = scene.progression || {};
  goToScene(prog.nextScene, prog.buttonText);
}


// =============================================================
// ENDING: File Report, the patron's question, the names, the
// morning on the Capitol, ten years later, the history, the review.
// =============================================================
const ending = { verdict: null, named: new Set(), listGiven: false };

function paras(text, cls) {
  return String(text || '').split(/\n\s*\n/)
    .map(p => `<p class="end-p${cls ? ' ' + cls : ''}">${esc(p)}</p>`).join('');
}

function showEnding(html) {
  document.getElementById('ending-inner').innerHTML = html;
  document.getElementById('ending-overlay').classList.add('open');
  document.getElementById('ending-card').scrollTop = 0;
}

function closeEnding() {
  document.getElementById('ending-overlay').classList.remove('open');
}

function setLocationLabels(name, sub, act) {
  document.getElementById('loc-name').textContent = name;
  document.getElementById('loc-sub').textContent  = sub;
  document.getElementById('loc-act').textContent  = act;
  document.getElementById('nb-loc').textContent   = name + ' · ' + act;
}

function fileReport() {
  if (gameState.reportFiled || !reportInvestigationDone() || !reportFieldsComplete()) return;
  if (!isDesktopDocked() && gameState.notebookOpen) toggleNotebook();
  if (gameState.cardOpen) closeCard();
  const E = GAME_DATA.ending, c = E.confirm;
  showEnding(`
    <span class="end-kicker">${esc(E.caseLabel)}</span>
    <div class="end-title">${esc(c.title)}</div>
    <hr class="card-rule">
    ${paras(c.text)}
    <div class="end-actions">
      <button class="end-btn-secondary" onclick="closeEnding()">Not Yet</button>
      <button class="card-transition-btn" onclick="beginEnding()">${esc(E.carryText)}</button>
    </div>`);
}

function beginEnding() {
  const E = GAME_DATA.ending;
  gameState.reportFiled = true;
  document.querySelectorAll('.report-textarea').forEach(t => { t.readOnly = true; });
  checkReportReady();
  runTransition(E.act, E.place, E.time, () => {
    document.body.classList.add('ending-mode');
    loadScene(E.scene);
    setLocationLabels(E.place, E.time, E.act);
    showVerdictPage();
  });
}

function showVerdictPage() {
  const E = GAME_DATA.ending, V = E.verdict;
  const opts = V.options
    .filter(o => !o.requiresAny || o.requiresAny.some(id => gameState.discovered.has(id)))
    .map(o => `<button class="end-verdict" onclick="chooseVerdict('${o.id}')">${esc(o.label)}<small>${esc(o.note || '')}</small></button>`)
    .join('');
  showEnding(`
    <span class="end-kicker">${esc(E.act)}</span>
    <div class="end-title">${esc(E.patron)}</div>
    <hr class="card-rule">
    ${paras(V.intro)}
    <div class="end-verdicts">${opts}</div>`);
}

function chooseVerdict(id) {
  ending.verdict = id;
  if (id === 'accuse') {
    ending.named = new Set();
    ending.listGiven = false;
    showOutcomePage();
  } else {
    showNamesPage();
  }
}

function endingCandidates() {
  return Object.values(gameState.people)
    .filter(p => !p.noPoi)
    .sort((a, b) => b.poi - a.poi);
}

function nameRow(name, sub, on, attr) {
  return `
    <div class="end-name-row">
      <div class="end-name-info">
        <div class="end-name">${esc(name)}</div>
        <div class="end-name-poi">${esc(sub)}</div>
      </div>
      <button class="end-toggle${on ? ' on' : ''}" ${attr} onclick="toggleEndingName(this)">${on ? 'Named' : 'Not Named'}</button>
    </div>`;
}

function showNamesPage() {
  const E = GAME_DATA.ending, N = E.names;
  const people = endingCandidates();
  ending.named = new Set(people.filter(p => p.poi === 2).map(p => p.name));
  ending.listGiven = false;
  let rows = people.map(p => nameRow(p.name, POI_LABELS[p.poi], ending.named.has(p.name), `data-name="${esc(p.name)}"`)).join('');
  if (gameState.discovered.has(N.listId)) rows += nameRow(N.listLabel, N.listNote, false, 'data-list="1"');
  showEnding(`
    <span class="end-kicker">${esc(E.act)}</span>
    <div class="end-title">${esc(E.patron)}</div>
    <hr class="card-rule">
    ${paras(ending.verdict === 'yes' ? N.intro : N.introNo)}
    ${rows ? paras(N.note, 'quiet') + `<div class="end-names">${rows}</div>` : ''}
    <div class="end-actions">
      <button class="card-transition-btn" id="end-give" onclick="showOutcomePage()"></button>
    </div>`);
  updateGiveButton();
}

function toggleEndingName(btn) {
  let on;
  if (btn.dataset.list) {
    ending.listGiven = !ending.listGiven;
    on = ending.listGiven;
  } else {
    const name = btn.dataset.name;
    if (ending.named.has(name)) ending.named.delete(name); else ending.named.add(name);
    on = ending.named.has(name);
  }
  btn.classList.toggle('on', on);
  btn.textContent = on ? 'Named' : 'Not Named';
  updateGiveButton();
}

function updateGiveButton() {
  const btn = document.getElementById('end-give');
  if (!btn) return;
  btn.textContent = (ending.named.size || ending.listGiven) ? 'Hand Him the Names' : 'Give Him No Names';
}

function endingResult() {
  const E = GAME_DATA.ending;
  const named = [...ending.named];
  return {
    named,
    anyNamed: named.length > 0 || ending.listGiven,
    broke:    ending.listGiven || named.some(n => E.fates[n] && E.fates[n].breaks)
  };
}

function showOutcomePage() {
  const E = GAME_DATA.ending, R = E.reaction;
  const r = endingResult();
  const v = ending.verdict;
  let html = `<span class="end-kicker">${esc(E.act)}</span>
    <div class="end-title">${esc(E.patron)}</div><hr class="card-rule">`;

  if (v === 'accuse') {
    html += paras(R.accuse);
  } else if (r.anyNamed) {
    html += paras(v === 'yes' ? R.names : R.namesNo);
    const echoesCalvus = ending.listGiven || r.named.some(n => E.calvusList.includes(n));
    if (gameState.discovered.has('informer_note') && echoesCalvus) html += paras(R.calvusNames);
  } else {
    html += paras(R.none);
    if (gameState.discovered.has('informer_note')) html += paras(R.calvusNone);
  }

  html += `<div class="end-head">The Capitol</div>`;
  html += paras(E.capitol[v]);
  html += paras(E.death);

  if (r.anyNamed) {
    html += `<div class="end-head">What Became of Them</div>`;
    r.named.forEach(n => {
      const f = E.fates[n];
      html += paras(f ? f.text : E.fateDefault.replace('{name}', n));
    });
    if (ending.listGiven) html += paras(E.listFate);
  }

  html += `<div class="end-head">The Land</div>`;
  html += paras(r.broke ? E.outcome.broken : E.outcome.strike);
  (E.outcome.codas || []).forEach(c => {
    const met = Object.values(gameState.people).some(p => p.name === c.person);
    if (met && !ending.named.has(c.person) && c.when === (r.broke ? 'broken' : 'strike')) html += paras(c.text);
  });
  html += `<div class="end-actions"><button class="card-transition-btn" onclick="goToEpilogue()">${esc(E.epilogue.heading)}</button></div>`;
  showEnding(html);
}

function goToEpilogue() {
  const P = GAME_DATA.ending.epilogue;
  runTransition(P.act, P.title, P.sub, () => {
    loadScene(P.scene);
    setLocationLabels(P.title, P.sub, P.act);
    showEpiloguePage();
  });
}

function showEpiloguePage() {
  const P = GAME_DATA.ending.epilogue;
  const v = P[ending.verdict] || P.no;
  let html = `<span class="end-kicker">${esc(P.act)}</span>
    <div class="end-title">${esc(P.heading)}</div><hr class="card-rule">
    ${paras(v.before)}
    <div class="end-stamp${ending.verdict === 'yes' ? ' good' : ''}">${esc(v.stamp)}</div>
    ${paras(v.after)}`;
  if (gameState.discovered.has('informer_note')) html += paras(P.calvus);
  html += paras(P.gaius);
  html += paras(P.close, 'quiet');
  html += `<div class="end-actions"><button class="card-transition-btn" onclick="showHistoryPage()">The History Behind the Story</button></div>`;
  showEnding(html);
}

function showHistoryPage() {
  const H = GAME_DATA.ending.history;
  let html = `<span class="end-kicker">Historical Note</span>
    <div class="end-title">The History Behind the Story</div><hr class="card-rule">
    ${paras(H.intro)}`;
  H.items.forEach(it => { html += `<div class="end-item-title">${esc(it.title)}</div>${paras(it.text)}`; });
  html += `<div class="end-actions"><button class="card-transition-btn" onclick="showReviewPage()">Review Your Inquiry</button></div>`;
  showEnding(html);
}

function allClueIds() {
  const ids = [];
  Object.values(GAME_DATA.scenes).forEach(s => {
    s.hotspots.forEach(h => { if (h.kind === 'clue') ids.push(h.id); });
  });
  return ids;
}

function discoveredHerrings() {
  const found = [];
  Object.values(GAME_DATA.scenes).forEach(s => s.hotspots.forEach(h => {
    if (h.kind === 'herring' && gameState.discovered.has(h.id)) found.push(h);
  }));
  return found;
}

function clueTitle(id) {
  const f = findHotspot(id);
  return f ? (f.h.content && f.h.content.title) || f.h.label : id;
}

function verdictText() {
  const o = GAME_DATA.ending.verdict.options.find(x => x.id === ending.verdict);
  return o ? o.label : '';
}

function namesGivenText() {
  if (ending.verdict === 'accuse') return 'None. You were put out of the temple first.';
  const list = [...ending.named];
  if (ending.listGiven) list.push(GAME_DATA.ending.names.listGivenText);
  return list.length ? list.join(', ') : 'None';
}

const REPORT_LABELS = { who: 'Quis · Who', what: 'Quid · What', where: 'Ubi · Where', when: 'Quando · When', why: 'Cur · Why' };

function showReviewPage() {
  const E = GAME_DATA.ending;
  let html = `<span class="end-kicker">${esc(E.caseLabel)}</span>
    <div class="end-title">Your Report</div><hr class="card-rule">`;
  REPORT_KEYS.forEach(k => {
    html += `<div class="end-q">${REPORT_LABELS[k]}</div><div class="end-a">${esc(gameState.report[k])}</div>`;
  });
  html += `<div class="end-q">Does He Seek a Crown?</div><div class="end-a">${esc(verdictText())}</div>`;
  html += `<div class="end-q">Names Given to Your Patron</div><div class="end-a">${esc(namesGivenText())}</div>`;

  const all = allClueIds();
  const foundCount = all.filter(id => gameState.discovered.has(id)).length;
  html += `<div class="end-head">What You Uncovered</div>`;
  html += paras(`You found ${foundCount} of the ${all.length} clues. Here is what drove the Roman poor to follow Tiberius Gracchus, what his enemies feared, and how much of it you saw.`, 'quiet');
  E.review.forEach(cat => {
    const got = cat.ids.filter(id => gameState.discovered.has(id));
    html += `<div class="end-cat">
      <div class="end-cat-top"><span class="end-cat-title">${esc(cat.title)}</span><span class="end-cat-count">${got.length} of ${cat.ids.length}</span></div>
      <div class="end-cat-desc">${esc(cat.text)}</div>
      ${got.length ? `<div class="end-cat-found">${esc(got.map(clueTitle).join(' · '))}</div>` : '<div class="end-cat-none">Nothing found here.</div>'}
    </div>`;
  });
  const herrings = discoveredHerrings();
  if (herrings.length) {
    html += `<div class="end-head">Rumours and Dead Ends</div>`;
    html += paras('Not every story you heard in Rome was true.', 'quiet');
    herrings.forEach(h => { html += `<div class="end-item-title">${esc(h.content.title)}</div>${paras(h.debunk)}`; });
  }
  html += `<div class="end-actions">
      <button class="end-btn-secondary" id="end-copy" onclick="copyFinalReport()">Copy Report</button>
      <button class="card-transition-btn" onclick="location.reload()">Play Again</button>
    </div>`;
  showEnding(html);
}

function finalReportText() {
  const lines = ['TO P. CORNELIUS SCIPIO NASICA, PONTIFEX MAXIMUS', 'INQUIRY INTO TI. SEMPRONIUS GRACCHUS, TRIBUNE OF THE PLEBS', 'REPORT OF HIS FREEDMAN', ''];
  REPORT_KEYS.forEach(k => { lines.push(REPORT_LABELS[k].toUpperCase() + ': ' + (gameState.report[k] || '').trim(), ''); });
  lines.push('DOES HE SEEK A CROWN? ' + verdictText(), '');
  lines.push('NAMES GIVEN TO THE PATRON: ' + namesGivenText());
  return lines.join('\n');
}

function copyFinalReport() {
  const text = finalReportText();
  const btn  = document.getElementById('end-copy');
  const done = () => {
    if (!btn) return;
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy Report'; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity  = '0';
  document.body.appendChild(ta);
  ta.select();
  try { if (document.execCommand('copy')) done(); } catch (e) {}
  ta.remove();
}

// =============================================================
// INPUT: MOUSE
// =============================================================
function initInput() {
  const vp = document.getElementById('game-viewport');

  vp.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    pan.dragging = true; pan.moved = false;
    pan.startMX = e.clientX; pan.startPX = pan.x;
    document.getElementById('panorama-container').style.transition = 'none';
    vp.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!pan.dragging) return;
    const dx = e.clientX - pan.startMX;
    if (Math.abs(dx) > DRAG_THRESHOLD) pan.moved = true;
    setPan(pan.startPX + dx, false);
  });
  window.addEventListener('mouseup', () => {
    pan.dragging = false;
    document.getElementById('game-viewport').classList.remove('dragging');
    setTimeout(() => { pan.moved = false; }, 50);
  });

  // Touch
  let tStartX = 0, tStartP = 0;
  vp.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    pan.moved = false;
    tStartX = e.touches[0].clientX; tStartP = pan.x;
    document.getElementById('panorama-container').style.transition = 'none';
  }, { passive: true });
  vp.addEventListener('touchmove', e => {
    if (e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - tStartX;
    if (Math.abs(dx) > DRAG_THRESHOLD) pan.moved = true;
    setPan(tStartP + dx, false);
  }, { passive: true });
  vp.addEventListener('touchend', () => {
    setTimeout(() => { pan.moved = false; }, 50);
  });

  // Keyboard
  window.addEventListener('keydown', e => {
    if (gameState.cardOpen) { if (e.key === 'Escape') closeCard(); return; }
    if (gameState.notebookOpen) { if (e.key === 'Escape') toggleNotebook(); return; }
    if (e.key === 'ArrowLeft')  panBy( 140, true);
    if (e.key === 'ArrowRight') panBy(-140, true);
  });

  // Chevrons
  document.getElementById('chev-left').addEventListener('click',  () => panBy( 220, true));
  document.getElementById('chev-right').addEventListener('click', () => panBy(-220, true));

  // Resize
  window.addEventListener('resize', () => { applyDockedLayout(); computeBounds(); });
}

// =============================================================
// UI BINDINGS
// =============================================================
function bindUI() {
  document.getElementById('card-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('card-overlay')) closeCard();
  });
  document.getElementById('card-close').addEventListener('click', closeCard);
  document.getElementById('nb-toggle').addEventListener('click', toggleNotebook);
  document.getElementById('nb-close').addEventListener('click',  toggleNotebook);
  document.getElementById('progress-btn').addEventListener('click', doProgression);
}

// =============================================================
// TUNE MODE: tap gear icon (top-left) to activate
// Guides you through each hotspot by name, one at a time.
// =============================================================
const tuneState = {
  active:  false,
  step:    0,       // index into current scene's hotspots
  results: []       // [{id, label, x, y}], filled as you tap
};

function initTuneMode() {
  document.getElementById('panorama-container').addEventListener('click', e => {
    if (!tuneState.active) return;
    if (pan.moved) return;
    recordTuneTap(e.clientX, e.clientY);
  });

  document.getElementById('tune-copy-btn').addEventListener('click', copyTuneOutput);
  document.getElementById('tune-clear-btn').addEventListener('click', restartTune);
  document.getElementById('tune-toggle-btn').addEventListener('click', toggleTuneMode);
  document.getElementById('tune-exit-btn').addEventListener('click', toggleTuneMode);
  document.getElementById('tune-skip-btn').addEventListener('click', skipTuneStep);
  document.getElementById('tune-tab').addEventListener('click', toggleTunePanel);

  // Scene jumper: reach any scene for tuning without playing up to it.
  const sel = document.getElementById('tune-scene');
  GAME_DATA.sceneOrder.forEach(id => {
    const s = GAME_DATA.scenes[id];
    if (!s) return;
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = s.name + ': ' + s.subtitle;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { loadScene(sel.value); restartTune(); });

  if (location.search.includes('tune')) toggleTuneMode();
}

function toggleTuneMode() {
  tuneState.active = !tuneState.active;
  document.body.classList.toggle('tune-mode', tuneState.active);
  document.getElementById('tune-toggle-btn').classList.toggle('active', tuneState.active);
  if (tuneState.active) {
    document.getElementById('tune-scene').value = gameState.currentScene;
    restartTune();
  } else {
    document.querySelectorAll('.tune-marker').forEach(el => el.remove());
  }
}

function toggleTunePanel() {
  const panel = document.getElementById('tune-panel');
  const tab   = document.getElementById('tune-tab');
  const open  = panel.classList.toggle('open');
  tab.textContent = open ? '\u25bc Results' : '\u25b2 Results';
}

function restartTune() {
  tuneState.step    = 0;
  tuneState.results = [];
  document.querySelectorAll('.tune-marker').forEach(el => el.remove());
  document.getElementById('tune-panel').classList.remove('open');
  document.getElementById('tune-tab').textContent = '\u25b2 Results';
  renderTunePrompt();
  renderTuneOutput();
}

function currentHotspots() {
  return GAME_DATA.scenes[gameState.currentScene].hotspots;
}

function renderTunePrompt() {
  const hotspots = currentHotspots();
  const prompt   = document.getElementById('tune-prompt');
  if (tuneState.step >= hotspots.length) {
    prompt.textContent = '\u2713 All done! Copy the coordinates below.';
    return;
  }
  const h     = hotspots[tuneState.step];
  const total = hotspots.length;
  prompt.textContent = `Tap: ${h.label}  (${tuneState.step + 1} of ${total})`;
}

function recordTuneTap(clientX, clientY) {
  const hotspots = currentHotspots();
  if (tuneState.step >= hotspots.length) return;

  const h       = hotspots[tuneState.step];
  const rect    = document.getElementById('panorama-container').getBoundingClientRect();
  const x       = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const y       = Math.max(0, Math.min(1, clientY / window.innerHeight));

  // Store result
  tuneState.results[tuneState.step] = { id: h.id, label: h.label, x, y };

  // Place marker
  const layer = document.getElementById('hotspot-layer');
  // Remove any previous marker for this step
  const prev = layer.querySelector(`.tune-marker[data-step="${tuneState.step}"]`);
  if (prev) prev.remove();

  const el = document.createElement('div');
  el.className       = 'tune-marker';
  el.dataset.step    = tuneState.step;
  el.style.left      = (x * 100) + '%';
  el.style.top       = (y * 100) + '%';
  el.innerHTML = `
    <div class="tune-marker-ring"></div>
    <div class="tune-marker-dot"></div>
    <div class="tune-marker-label">${h.label}</div>`;
  layer.appendChild(el);

  tuneState.step++;
  renderTunePrompt();
  renderTuneOutput();
  // Auto-open panel when all done
  if (tuneState.step >= currentHotspots().length) {
    document.getElementById('tune-panel').classList.add('open');
    document.getElementById('tune-tab').textContent = '\u25bc Results';
  }
}

function skipTuneStep() {
  const hotspots = currentHotspots();
  if (tuneState.step >= hotspots.length) return;
  // Mark as skipped (keep existing coords from GAME_DATA)
  const h = hotspots[tuneState.step];
  tuneState.results[tuneState.step] = { id: h.id, label: h.label, x: h.x, y: h.y, skipped: true };
  tuneState.step++;
  renderTunePrompt();
  renderTuneOutput();
}

function renderTuneOutput() {
  const hotspots = currentHotspots();
  const lines = hotspots.map((h, i) => {
    const r = tuneState.results[i];
    if (!r)            return `  // ${h.label}: not placed yet`;
    if (r.skipped)     return `  // ${h.label}: skipped (keeping x:${h.x}, y:${h.y})`;
    return `  id:'${r.id}', x:${r.x.toFixed(3)}, y:${r.y.toFixed(3)},  // ${r.label}`;
  });
  document.getElementById('tune-output').textContent = lines.join('\n');
}

function copyTuneOutput() {
  // Only copy the placed (non-skipped, non-pending) lines
  const hotspots = currentHotspots();
  const lines = hotspots.map((h, i) => {
    const r = tuneState.results[i];
    if (!r || r.skipped) return null;
    return `  id:'${r.id}', x:${r.x.toFixed(3)}, y:${r.y.toFixed(3)},`;
  }).filter(Boolean);

  const text = lines.join('\n');
  const btn  = document.getElementById('tune-copy-btn');

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy All', 1800);
    });
  } else {
    const el = document.getElementById('tune-output');
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

// =============================================================
// UTILITY
// =============================================================
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// =============================================================
// BOOT
// =============================================================
document.addEventListener('DOMContentLoaded', () => {
  applyDockedLayout();
  bindUI();
  initInput();
  loadScene(gameState.currentScene);
  if (DEV_TOOLS) initTuneMode();
  else document.getElementById('tune-toggle-btn').style.display = 'none';
});
</script>
