    forum_day: {
      id: 'forum_day',
      name: 'The Forum Romanum',
      subtitle: 'Midsummer, 133 BC',
      actLabel: 'Act II - The City',
      image: 'art/forum_day.jpg',
      hotspots: [
        { id:'to_subura', label:'To the Subura', x:0.030, y:0.82, type:'navigation', goto:'subura_insula' },

        { id:'curia', label:'The Senate House', x:0.105, y:0.30, type:'object', kind:'clue', required:false,
          content:{ title:'The Curia Hostilia',
            text:"The Senate house, dark brick and old bronze doors. Three hundred men meet inside, nearly all of them landowners, every one of them a former magistrate who will sit there for life. They do not pass laws. Only the Assemblies of the People do that. But for as long as anyone remembers, nobody has brought a law to the People without asking the Senate first.\n\nTiberius Gracchus did not ask." } },

        { id:'graffiti', label:'Writing on the Wall', x:0.200, y:0.48, type:'object', kind:'clue', required:false,
          content:{ title:'Writing on the Wall',
            text:"Charcoal scrawls cover the plaster of the portico, some old, some still smudgy.\n\nTI GRACCHE REDDE AGRVM PVBLICVM PAVPERIBVS\nTiberius Gracchus, give the public land back to the poor.\n\nAnd lower, in a clumsier hand: WE FOUGHT FOR IT.\n\nThe writing goes on for the whole length of the wall, on the columns, on the base of a statue. Nobody paid for this." } },

        { id:'tiberius', label:'The Tribune at the Rostra', x:0.305, y:0.40, type:'dialogue', kind:'clue', required:true,
          content:{ title:'Tiberius Gracchus',
            people:['Tiberius Gracchus'],
            desc:"On the speakers' platform, decorated with the bronze beaks of captured warships, a young man in a white toga is speaking. He does not stand still like the old senators do. He walks the platform, and his voice carries all the way across the Forum.",
            lines:[
              "The wild beasts that roam over Italy have every one of them a cave or lair to lurk in. But the men who fight and die for Italy enjoy the common air and light, and nothing else.",
              "Houseless and homeless, they wander about with their wives and children. Their generals lie when they tell the soldiers in battle to fight for their tombs and the shrines of their fathers. Not one of them has a family altar. Not one has an ancestral tomb.",
              "They fight and die to keep other men in wealth and luxury. They are called the masters of the world, and they have not a single clod of earth that is their own!",
              "The land belongs to the Roman People. I ask only that the People take back what is theirs, and give it to the men who bled for it."
            ] } },

        { id:'octavius_bench', label:'The Empty Bench', x:0.430, y:0.74, type:'object', kind:'clue', required:false,
          content:{ title:'The Empty Bench',
            text:"The tribunes' bench stands at the foot of the Rostra. One place on it is empty.\n\nIt belonged to Marcus Octavius, tribune, who vetoed the land law. Tiberius begged him in public to withdraw it. He would not. So Tiberius put a new question to the Assembly: should a tribune who works against the People stay in office? The tribes voted, one by one. When the eighteenth tribe voted yes, Octavius was no longer a tribune.\n\nNo tribune had ever been removed before. The crowd dragged him off the platform. A slave who threw himself in front of his master had his eyes torn out." } },

        { id:'octavius', label:'Marcus Octavius', x:0.468, y:0.52, type:'dialogue', kind:'clue', noPoi:true, required:false,
          content:{ title:'Marcus Octavius',
            desc:"A serious man in a plain toga, standing apart from the crowd. People step out of his way without meeting his eye.",
            lines:[
              "You are wondering if I am bitter. Tiberius and I were friends. We still are, I think, in some way neither of us understands.",
              "I hold public land. Yes. He offered to pay me for my loss out of his own pocket, in front of everyone. I said no, and he took it as an insult.",
              "But listen. The veto exists so that one tribune can stop the others when the crowd is hot. If the People can throw out any tribune who displeases them, what is a tribune for? He did not break the law. He found a way around it, in front of everybody, and they cheered.",
              "Whoever comes after him will remember how it was done."
            ] } },

        { id:'rustics', label:'Men from the Country', x:0.555, y:0.66, type:'dialogue', kind:'clue', required:false,
          grants:['knows_estate'],
          content:{ title:'Men from the Country',
            people:['Sextus Lollius'],
            desc:"A knot of sunburned men in rough brown tunics, dusty to the knees, eating bread out of their cloaks. Country men, not city men.",
            lines:[
              "Two days on foot from Reate to get here. I am Sextus Lollius, tribe Quirina, and when they vote, my vote counts the same as a senator's, by Hercules.",
              "Only a man has to be here to cast it. That is the trouble. Every year the vote is at harvest, and every year the rich men's slaves bring in the harvest and the poor men have to choose: bring in their grain, or come to Rome and vote.",
              "Half my village stayed home this time. Can't eat a vote.",
              "You want to see why we are poor? Walk out the Via Tiburtina, through the city gate there. Half a day out, the great estates begin. Look who is working the fields. It isn't Romans.",
              "There is a man in the Subura gathering the country men, tribe by tribe, so we know who has come in. Arrius. Ask anyone in the courtyards there."
            ] } },

        { id:'temple_castor', label:'Temple of Castor', x:0.640, y:0.25, type:'object', kind:'ambiance', required:false,
          content:{ title:'The Temple of Castor',
            text:"The temple of the twin horsemen, Castor and Pollux, who rode out of nowhere to save Rome in battle and watered their horses at the spring below. The money-changers keep their strongboxes in the cellars underneath. Even the gods in Rome have business to attend to." } },

        { id:'philo', label:'Philo the Money-Changer', x:0.685, y:0.60, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Philo the Money-Changer',
            people:['Philo the Money-Changer'],
            desc:"A Greek freedman behind a table of scales, coins stacked in neat columns.",
            lines:[
              "Gold from Pergamum! That is all anyone wants to talk about. King Attalus died this spring and left his whole kingdom to the Roman People in his will. Cities, treasure, everything.",
              "The Senate has always decided what to do with a foreign kingdom. Always. But Gracchus stood up and said the treasure should go to the new farmers, to buy oxen and ploughs and seed, so they can make their lots pay. And that the People, not the Senate, should decide about the cities of Asia.",
              "You can see the senators' faces when he says it. It is not only the money. It is who gets to decide.",
              "Me? Prices are up since the slave war in Sicily stopped the grain ships. A man buying bread does not care who rules Pergamum."
            ] } },

        { id:'temple_saturn', label:'Temple of Saturn', x:0.800, y:0.25, type:'object', kind:'clue', required:false,
          content:{ title:'The Temple of Saturn',
            text:"The Treasury of the Roman People is kept in the strongrooms under the Temple of Saturn, guarded by the quaestors. Every war Rome fights is paid for from here, and every conquest pays back into it. If the treasure of Pergamum ever reaches Rome, this is where it will go.\n\nWho holds the key to this door has always been the Senate's business." } },

        { id:'crier', label:'A Man on a Barrel', x:0.875, y:0.57, type:'dialogue', kind:'herring', noPoi:true, required:false,
          debunk:"There was no Etruscan army. The men pouring into Rome that summer were voters from the country tribes, and most of them came armed with nothing but a cloak and a loaf of bread. Tiberius did go about the city with a crowd of supporters around him, and by the last day some of them carried staves. When the killing came, it was the senators' men who brought the clubs.",
          content:{ title:'A Man on a Barrel',
            desc:"A red-faced man shouting to anyone who will stop.",
            lines:[
              "Citizens! Do you know who is camping in the Subura? Etruscans! Thousands of them, armed to the teeth, brought down from the hills by Gracchus!",
              "Mark me, the day of the vote he will march them up the Capitol and make himself king! I have it from a man who has it from a senator's own slave!"
            ] } },

        { id:'lacus_curtius', label:'A Paved Hollow', x:0.470, y:0.92, type:'object', kind:'trivial', required:false,
          content:{ title:'The Lacus Curtius',
            text:"A small fenced patch of old paving in the middle of the Forum. The story goes that a chasm once opened here, and the soothsayers said it would close only when Rome threw in her greatest treasure. A young soldier named Curtius rode his horse into it, fully armed, saying Rome had no greater treasure than a brave citizen. The earth closed over him. People toss coins in for luck." } },

        { id:'stands', label:'Wooden Stands', x:0.905, y:0.36, type:'object', kind:'trivial', required:false,
          content:{ title:'Wooden Stands',
            text:"Carpenters are hammering together tiers of wooden seats at the end of the Forum. A great family is holding funeral games for a dead father: a feast for the people, and pairs of gladiators fighting here, in the middle of the city, in front of the Senate house.\n\nThere is no stone arena in Rome. The Colosseum will not be built for another two hundred years. Families who can pay rent the best seats; the poor watch from rooftops and steps.\n\nAbout ten years from now a tribune will tear stands like these down in the night so the poor can watch for free. His name will be Gracchus." } },

        { id:'vestal', label:'A Woman in White', x:0.245, y:0.62, type:'dialogue', kind:'ambiance', noPoi:true, required:false,
          content:{ title:'Claudia, Vestal Virgin',
            desc:"A woman in a long white robe, her hair bound with woollen ribbons under a white veil. A lictor walks ahead of her clearing the way, and people step aside and bow their heads. A Vestal Virgin.",
            lines:[
              "You may look. Everyone does. I serve Vesta, goddess of the hearth. In her round temple at the end of the Forum, six of us keep her sacred fire burning day and night. If it ever goes out, Rome is in danger.",
              "They choose us as girls, between six and ten years old, and we serve for thirty years. A Vestal may own property and make a will without any man's permission. A lictor walks before me as he would before a consul. If a condemned man meets one of us by chance on the way to his execution, he goes free.",
              "My name is Claudia. My sister, the tribune's wife, is Claudia too. Every daughter of the Claudii is Claudia. Romans give their girls the family name and number them if they must: the elder, the younger, Tertia, the third.",
              "Ten years ago, when my father rode in his triumph, a tribune tried to drag him down from his chariot. I climbed up and rode beside him through the city, and no one dared lay a hand on a Vestal. So do not tell me women have no part in Roman politics."
            ] } },

        { id:'sundial', label:'A Sundial on a Pillar', x:0.390, y:0.47, type:'object', kind:'trivial', required:false,
          content:{ title:'A Sundial on a Pillar',
            text:"Rome's first sundial was carried home as war loot from the city of Catania in Sicily, about a hundred and thirty years ago, and set up here by the Rostra. Nobody noticed that Catania is much farther south than Rome. For ninety-nine years the whole city told the time by a sundial that was wrong. A newer one, made for Rome, stands here now.\n\nRomans split the daylight into twelve hours, sunrise to sunset. So a summer hour is long, and a winter hour is short." } },

        { id:'lictors', label:"The Consul's Lictors", x:0.770, y:0.62, type:'object', kind:'ambiance', required:false,
          content:{ title:"The Consul's Lictors",
            text:"A line of men pushes through the crowd, each carrying on his shoulder a bundle of rods tied with red straps: the fasces. They are lictors, and they walk ahead of the consul, the highest official in Rome. There are two consuls, elected every year, so that no one man ever holds all the power. Each has twelve lictors.\n\nThe rods mean the consul can have a man beaten. Outside the city, an axe is tied into the bundle, meaning he can have a man put to death. Inside the city the axes are taken out. Here, a Roman citizen has the right to appeal to the People first." } },

        { id:'chickpeas', label:'The Chickpea Seller', x:0.955, y:0.83, type:'object', kind:'trivial', required:false,
          content:{ title:'The Chickpea Seller',
            text:"A girl with a brazier is roasting chickpeas and selling them by the cupful, hot, for a copper. The smell drifts across half the Forum. She is doing better business today than any senator." } },

        { id:'to_palatine', label:'Up to the Palatine', x:0.520, y:0.20, type:'object', kind:'ambiance', required:false,
          goto:'gracchus_house', gotoText:'Climb to the House of Gracchus',
          gotoRequires:['arrius_invite'],
          gotoLocked:"The House of the Gracchi is up there, among the senators' houses. A freedman of Scipio Nasica cannot just knock on that door. You would need someone to bring you in.",
          content:{ title:'The Palatine Hill',
            text:"Above the Forum the Palatine rises in terraces, crowded with the great houses of the oldest families. Your patron's house is up there. So is the house of the Sempronii Gracchi, where a line of men has been coming and going all morning." } },

        { id:'to_tiburtina', label:'The Road out of the City', x:0.975, y:0.62, type:'navigation', goto:'tiburtina_estate',
          requires:['knows_estate'] }
      ]
    },

    subura_insula: {
      id: 'subura_insula',
      name: 'The Subura',
      subtitle: 'A Tenement Courtyard',
      actLabel: 'Act II - The City',
      image: 'art/subura_insula.jpg',
      hotspots: [
        { id:'subura_back', label:'Back to the Forum', x:0.025, y:0.80, type:'navigation', goto:'forum_day' },

        { id:'compitum', label:'The Crossroads Shrine', x:0.085, y:0.52, type:'object', kind:'ambiance', required:false,
          content:{ title:'The Crossroads Shrine',
            text:"A little shrine to the Lares of the crossroads, the gods of the neighbourhood. Slaves and free poor tend it together, and at the festival in winter every household hangs a wool doll here, one for each free person and a woolen ball for each slave. Down here, the gods keep count of everybody." } },

        { id:'naevia', label:'A Woman Spinning', x:0.190, y:0.65, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Naevia',
            people:['Naevia'],
            desc:"A widow in a faded stola, spinning wool on a drop spindle in the doorway of a ground-floor room. A boy of about twelve sits beside her sorting the wool.",
            lines:[
              "My husband went to Spain with the legions nine years ago. Spain, then Spain again. The war there never ends. In the end it was the Spanish war that kept him.",
              "We had a little farm near Praeneste. While he was gone I could not work it alone, and the debts came, and our neighbour, a senator's man, was always so kind about lending. When he came for the land, he was kind about that too.",
              "Now I spin wool for a contractor at two asses a pound, and we live in this room, and the rent goes up every spring because there are more of us every spring.",
              "My boy will be old enough for the legions in five years. They will not take him. A boy with no property cannot serve. If the law passes, if there is land again, he could have a farm. A farm he could never be made to sell."
            ] } },

        { id:'grain_jar', label:'An Empty Grain Jar', x:0.320, y:0.84, type:'object', kind:'clue', required:false,
          content:{ title:'An Empty Grain Jar',
            text:"A tall clay jar by Naevia's door, the kind a family keeps its grain in. You tip it. Empty but for dust.\n\nThe grain ships from Sicily have been short for two years, ever since the slaves on the great Sicilian estates rose up in revolt. The price of a measure of wheat in the Subura has nearly doubled." } },

        { id:'knucklebones', label:'Children at Play', x:0.405, y:0.90, type:'object', kind:'trivial', required:false,
          content:{ title:'Children at Play',
            text:"Three small children crouch in the dust tossing knucklebones, sheep's ankle bones, and arguing about the score. The best throw is called the Venus, when all four land on different sides. The worst is called the Dog. One of them is accusing another of cheating with a loaded bone. Some things in Rome never change." } },

        { id:'arrius', label:'The Veteran with the Lists', x:0.490, y:0.62, type:'dialogue', kind:'clue', required:false,
          grants:['arrius_invite'],
          content:{ title:'Quintus Arrius',
            people:['Quintus Arrius'],
            desc:"A grizzled man with a scar down one arm, sitting at a table in the courtyard, writing names on wax tablets in big careful letters while men queue in front of him.",
            lines:[
              "Name? Tribe? Next. Sorry, friend, you want something? I am Quintus Arrius. Twelve years a soldier.",
              "I was at Numantia, in Spain, four years ago. Twenty thousand of us trapped in a ravine by the Numantines, and the consul could not get us out. It was Tiberius Gracchus who rode into their town and talked them into letting us walk home alive. They trusted him because they had trusted his father.",
              "The Senate tore up the treaty. They called it a disgrace. They would rather we had died with honour, I suppose.",
              "When I came home, my farm in the Sabine hills was gone. My father was dead, the debt was called in, and a rich man owned the whole valley. Twelve years in the legions to win Spain for Rome, and not a foot of Italy to show for it.",
              "So I keep lists. Rome votes by tribes: thirty-five tribes, and each casts one vote. Four of them are the city. Thirty-one are the countryside. If enough country men come in, the country tribes carry the vote.",
              "You write a fair hand? The land commission needs scribes to copy the claims. Go up to the House of the Gracchi on the Palatine and tell them Arrius sent you."
            ] } },

        { id:'tribe_lists', label:'The Tablets on the Table', x:0.560, y:0.73, type:'document', kind:'clue', required:false,
          content:{ title:'The Tribe Lists',
            text:"A stack of wax tablets, filled edge to edge in Arrius' big careful letters. Each one is headed with the name of a country tribe: POLLIA. QVIRINA. SABATINA. CLVSTVMINA. Under each, the names of men who have come into the city for the vote, and where they are sleeping.\n\nSEX. LOLLIVS, of Reate, by the Fountain of the Camenae.\nC. TITIVS, of Tusculum, with his brother.\nL. APRONIVS, veteran of Numantia, in this courtyard.\n\nTwo hundred and twelve names. Every name is a man who walked to Rome to vote." } },

        { id:'crack', label:'A Crack in the Wall', x:0.645, y:0.18, type:'object', kind:'ambiance', required:false,
          content:{ title:'A Crack in the Wall',
            text:"A crack runs from the third floor to the roof, wide enough to put your hand in, propped with timbers. Tenements like this one are built cheap and built tall, five storeys of rubble and timber, and every year in Rome a few of them fall down or burn. The top floors cost least. The people who live there have farthest to run." } },

        { id:'gnaeus', label:'The Rent Collector', x:0.735, y:0.60, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Gnaeus the Rent Collector',
            people:['Gnaeus the Rent Collector'],
            desc:"A heavy man with a ledger tablet and a stick, working his way door to door.",
            lines:[
              "Rent is due on the Kalends, and today is the Kalends. You living here? No? Then do not get in my way.",
              "The owner is a knight. Lives on the Quirinal and has never set foot in this courtyard. I collect, I take my share, I pay him the rest. That is the whole of it.",
              "Up every year, yes. Every year more of them come in from the country with their families and their bundles, and every one of them needs a room. I could let that staircase twice over.",
              "Between you and me? Land in the country is the best thing that could happen to this place. Half these people never wanted to be here."
            ] } },

        { id:'vote_seller', label:'A Man Selling Votes', x:0.820, y:0.72, type:'dialogue', kind:'herring', noPoi:true, required:false,
          debunk:"Buying votes really was a problem in Roman elections, and the Senate passed law after law against it. But nothing tied Tiberius Gracchus to bribery. Six years earlier, in 139 BC, a tribune named Gabinius had passed a law giving Romans a secret written ballot, precisely so that powerful men could no longer watch how their clients and tenants voted. The sneering man in the courtyard was offering to sell a vote that nobody could check.",
          content:{ title:'A Man Selling Votes',
            desc:"A sharp-faced man lounging against a column, who catches your eye and winks.",
            lines:[
              "You look like a man with a patron. Tell him this from me: everyone in this courtyard has been bought. Gracchus pays five denarii a vote, I have seen the purses.",
              "Of course, I would vote any way your patron likes for six."
            ] } },

        { id:'fullery', label:'The Fullery', x:0.875, y:0.68, type:'object', kind:'trivial', required:false,
          content:{ title:'The Fullery',
            text:"A fuller's shop opens onto the courtyard, where men stand knee-deep in vats treading woollen cloth to clean it. The cleaning agent is urine, collected in pots on street corners. Your eyes water from across the courtyard. The fuller waves cheerfully. He has long since stopped noticing." } },

        { id:'fountain', label:'The Public Fountain', x:0.960, y:0.62, type:'object', kind:'trivial', required:false,
          content:{ title:'The Public Fountain',
            text:"A stone basin with water running into it from a lead pipe, and a queue of women with jars. The water is cold and clean. It comes from the new aqueduct, the Aqua Marcia, built just a few years ago, that brings water sixty miles from the springs of the Anio valley. Rome can carry a river across the hills. It has not yet found a way to keep a roof over these people's heads." } },

        { id:'tertia', label:'A Girl with a Water Jar', x:0.665, y:0.68, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Tertia',
            people:['Tertia'],
            desc:"A girl of about eleven, barefoot, a water jar balanced on her head, watching everything with quick eyes.",
            lines:[
              "I'm Tertia. It means 'Third.' My sisters are Prima and Secunda. Father ran out of names.",
              "I carry water up four flights of stairs twelve times a day, so I know every door in this building. Arrius pays me a copper to run messages for him: who's come in from the country, which courtyard they're sleeping in.",
              "My brothers went to the schoolmaster to learn their letters. I learned mine on the steps, from Arrius' tablets. I can read every name on them. Don't tell my mother.",
              "In two or three years they'll marry me off. Girls can't vote. But before I go, I'm going to see one vote with my own eyes."
            ] } },

        { id:'food_counter', label:'A Hot-Food Counter', x:0.345, y:0.64, type:'object', kind:'trivial', required:false,
          content:{ title:'A Hot-Food Counter',
            text:"A shop counter opens onto the courtyard with big clay pots sunk into it, steaming. For a copper you get a bowl of puls, a thick porridge of wheat or barley, with beans in it if you are lucky, and a bit of sausage if you are rich.\n\nMost rooms in the tenement have no kitchen at all. A cooking fire on the fourth floor is how whole buildings burn down. So the Subura eats out. Everything gets a splash of garum, a salty sauce made from fish guts left to rot in the sun. Romans love it." } },

        { id:'chamber_pot', label:'Look Out Below', x:0.425, y:0.27, type:'object', kind:'trivial', required:false,
          content:{ title:'Look Out Below',
            text:"A shutter bangs open on the second floor and a woman empties a chamber pot into the courtyard. Everyone below has already jumped clear. There is no plumbing up there; the aqueduct water stops at the fountain on the ground.\n\nRoman law says that if something thrown from a window hurts a passer-by, whoever lives in that room has to pay. That there is a law about it tells you how often it happens." } }
      ]
    },

    tiburtina_estate: {
      id: 'tiburtina_estate',
      name: 'The Via Tiburtina',
      subtitle: 'An Estate, Half a Day from Rome',
      actLabel: 'Act II - The Country',
      image: 'art/tiburtina_estate.jpg',
      hotspots: [
        { id:'old_tullus', label:'An Old Man at a Fence', x:0.070, y:0.65, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Old Tullus',
            people:['Old Tullus'],
            desc:"A bent old man leaning on his hoe by a crooked fence, guarding a little patch of beans and an olive tree as if they might walk off.",
            lines:[
              "Seven iugera. That is what is left. My grandfather's grandfather had this from the colony, and I mean to die on it.",
              "Used to be thirty families in this valley. Their boys went to Spain, to Africa, to Macedonia. Some never came back. The ones who did found the farm in weeds and the debts doubled. And the big estate was always ready to buy.",
              "And if a man will not sell? The estate's oxen get into his barley. His boundary stone walks fifty feet in the night. Last winter somebody threw a dead dog down my well.",
              "Go to law against a Scipio? Me? Ha. Who would the praetor believe?"
            ] } },

        { id:'olive_tree', label:'The Olive Tree', x:0.050, y:0.30, type:'object', kind:'trivial', required:false,
          content:{ title:'The Olive Tree',
            text:"An old olive tree, twisted and silver-green, older than Old Tullus. Olives are the most useful thing a Roman farm grows. Their oil is for cooking, for burning in clay lamps at night, and for washing: Romans have no soap, so they rub oil on their skin and scrape it off, dirt and all, with a curved metal tool called a strigil.\n\nAn olive tree takes years to bear fruit and can live for centuries. A family that plants one expects to stay." } },

        { id:'ruined_farm', label:'A Ruined Farmhouse', x:0.165, y:0.47, type:'object', kind:'clue', required:false,
          content:{ title:'A Ruined Farmhouse',
            text:"A small farmhouse of mud brick on stone footings, its roof fallen in and grass growing in the hearth. In the rubble you find a clay loom weight and a child's toy, a little terracotta horse with one leg snapped off.\n\nSomebody lived here once, wove cloth here, raised children here. Now it stands in the corner of a great field that rolls all the way to the villa on the hill." } },

        { id:'old_tomb', label:'A Tomb in the Vineyard', x:0.255, y:0.60, type:'object', kind:'clue', required:false,
          content:{ title:'A Tomb in the Vineyard',
            text:"A small family tomb stands in the middle of the vines, its stone weathered smooth. The inscription is old-fashioned Latin: the Opsii, father, mother, sons.\n\nThe Opsii are gone. Their dead are still here, in the middle of somebody else's vineyard, and nobody brings them offerings anymore. Tiberius said it at the Rostra: the men who fight for Italy have no family tomb. Here is one, and the family is gone." } },

        { id:'boundary_stone', label:'A Boundary Stone', x:0.335, y:0.82, type:'object', kind:'clue', required:false,
          content:{ title:'A Boundary Stone',
            text:"A squat stone post at the edge of the vineyard, carved with old letters: AGER PVBLICVS. Public land. Land belonging to the Roman People.\n\nThere are scrape marks in the dirt around its base, and a pale ring where it used to stand, a good distance off. Somebody has moved it." } },

        { id:'damon', label:'The Overseer', x:0.440, y:0.58, type:'dialogue', kind:'clue', required:false,
          grants:['saw_estate'],
          content:{ title:'Damon the Overseer',
            people:['Damon the Overseer'],
            desc:"The vilicus, the slave who runs the estate for its owner, in a good tunic, a whip coiled at his belt.",
            lines:[
              "Hermon sent you? Then you can see whatever you want. The master likes his books kept clean.",
              "Three thousand iugera, give or take. Wheat on the flats, vines and olives on the slopes, sheep in the hills. Most of it is public land. The family took it up after the Hannibal war, when there was nobody left to farm it. They are supposed to pay the state a share of the harvest. Nobody has asked for it in my lifetime.",
              "Free labourers? Not if you can help it. A free man can be called up for the legions the day before harvest. A slave cannot. A slave never goes to war, and his children belong to the estate.",
              "When Gracchus' surveyors come with their measuring poles, that is the end of this. Five hundred iugera, and the rest cut up into little farms for anybody with a toga. The master will not let that happen. You can tell him I said so."
            ] } },

        { id:'chain_gang', label:'The Chained Gang', x:0.560, y:0.64, type:'object', kind:'clue', required:false,
          content:{ title:'The Chained Gang',
            text:"A line of men hoeing between the rows, chained at the ankle, two by two. Spanish, mostly, by their look and the scraps of speech you catch. Prisoners from the wars.\n\nThe legions that conquered Spain took them prisoner and sent them here to be sold. The farmers who fought in those legions came home to find these men working the land they used to own." } },

        { id:'ergastulum', label:'A Low Stone Building', x:0.665, y:0.45, type:'object', kind:'clue', required:false,
          content:{ title:'The Ergastulum',
            text:"A long low building half sunk into the ground, with slits for windows too high to reach. It is the ergastulum, where the chained slaves are locked in at night. You can smell it from here.\n\nOn the great estates in Sicily, men locked in places like this one rose up three years ago and killed their masters. They are fighting still." } },

        { id:'villa', label:'The Villa on the Hill', x:0.785, y:0.22, type:'object', kind:'clue', required:false,
          content:{ title:'The Villa',
            text:"Up on the hill, the owner's villa: white walls, a long colonnade, a garden, a fishpond, a view of the whole valley. Your patron comes out here perhaps twice a year, to escape the heat of the city.\n\nEverything you can see from that colonnade, he thinks of as his." } },

        { id:'syrus', label:'The Shepherd', x:0.880, y:0.62, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Syrus the Shepherd',
            people:['Syrus'],
            desc:"A young slave shepherd leaning on his crook by the flock, a long way from the overseer.",
            lines:[
              "They call me Syrus, because I come from Syria. That is not my name. Nobody here has asked my name.",
              "You have heard about Sicily? A slave named Eunus, a Syrian like me, led the slaves on the great estates in revolt. Thousands of them. They took the city of Enna, and Eunus put on a diadem and called himself King Antiochus. For three years Rome has not been able to beat them.",
              "A king of slaves! The masters here are afraid of us. That is why the chains.",
              "This law of your tribune. It gives land to Roman citizens. Good. It gives nothing to me. When the free men get their farms, someone will still sell me to the next estate."
            ] } },

        { id:'herius', label:'A Muleteer on the Road', x:0.950, y:0.68, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Herius the Marsian',
            people:['Herius the Marsian'],
            desc:"A man leading a string of mules loaded with jars down the Via Tiburtina, toward Rome. He speaks Latin with a mountain accent.",
            lines:[
              "I am a Marsian, from the mountains past Tibur. An ally of Rome, as they say. We fight in every one of Rome's wars, side by side with the legions. More of us than of them, some years.",
              "My family has farmed a piece of Roman public land for sixty years. Our grandfathers were given leave to settle it. Now the Romans want to measure it again and give it to Romans.",
              "And who speaks for us when the commissioners come? We cannot vote in your Assembly. We are allies when there is fighting to do. When there is land to share, we are foreigners.",
              "Your tribune means well for his people. I do not see that he means anything for mine."
            ] } },

        { id:'vines', label:'The Vines', x:0.320, y:0.48, type:'object', kind:'ambiance', required:false,
          content:{ title:'The Vines',
            text:"Row after row of vines trained on stakes, heavy with green grapes. Wine is worth far more than wheat, and a great estate with slaves to tend it can wait the years it takes a vineyard to come into bearing. A small farmer with a family to feed this winter cannot." } },

        { id:'hare', label:'A Hare', x:0.610, y:0.88, type:'object', kind:'trivial', required:false,
          content:{ title:'A Hare',
            text:"A hare bolts out of the stubble almost under your feet and zigzags away across the field. It has the run of the whole three thousand iugera, and owes nobody anything for it." } },

        { id:'vilica', label:'A Woman with a Basket', x:0.730, y:0.65, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Philumena',
            people:['Philumena'],
            desc:"A slave woman carrying a basket of bread and a jug of water out to the field gang. She is the vilica, the overseer's partner, who runs the kitchen, the stores, the spinning, and the sick room.",
            lines:[
              "Philumena. Damon runs the fields; I run everything else. The master's farming book says a vilica should not gossip or wander about the neighbours. I'm talking to you anyway.",
              "Slaves can't marry, under the law. Damon and I are together because the master allows it. Our children belong to the estate, the way the lambs do.",
              "If this law comes and the estate is cut down, they won't free us. They'll sell us. At a sale, families get split up. I've seen it.",
              "Do I want the poor to have land? I do. I would just like somebody, once, to ask what happens to us."
            ] } },

        { id:'via_road', label:'The Paved Road', x:0.905, y:0.94, type:'object', kind:'trivial', required:false,
          content:{ title:'The Paved Road',
            text:"The Via Tiburtina, paved with big fitted blocks of hard grey stone. Roman roads are built in layers like a cake: a deep trench, then rubble, then gravel, then sand, then paving stones on top, curved so rain runs off to the sides. They run as straight as the engineers can make them, so armies can march fast.\n\nEvery Roman mile, a thousand paces, a milestone tells you how far you are from Rome, in Roman numerals. I is one, V is five, X is ten. The stone up the road says XVI: sixteen miles." } },

        { id:'estate_back', label:'Back to Rome', x:0.985, y:0.86, type:'navigation', goto:'forum_day' }
      ]
    },

    gracchus_house: {
      id: 'gracchus_house',
      name: 'House of the Gracchi',
      subtitle: 'The Palatine, Afternoon',
      actLabel: "Act III - The Tribune's House",
      image: 'art/gracchus_house.jpg',
      hotspots: [
        { id:'dusk_door', label:'The Street Door', x:0.035, y:0.50, type:'object', kind:'ambiance', required:false,
          goto:'vigil_night', gotoText:'Stay Until Nightfall',
          gotoRequires:['saw_estate', 'gaius'],
          gotoNote:"Once night falls, you will not see the city by daylight again.",
          gotoLocked:{
            saw_estate:"Everyone you have asked says this began out on the great estates along the Via Tiburtina. You have not seen them for yourself yet, and after tonight there will be no time. The road out of the city leaves from the Forum.",
            gaius:"You came here to learn what the tribune's people intend. You have not yet spoken to anyone who sits on the land commission."
          },
          content:{ title:'The Street Door',
            text:"Through the open door, the street is filling up. Men keep arriving and not leaving: country men with bundles, veterans, whole families. They sit along the walls of the houses opposite as if they mean to stay all night." } },

        { id:'cornelia', label:'The Mother of the Gracchi', x:0.130, y:0.62, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Cornelia',
            people:['Cornelia'],
            desc:"A grey-haired woman seated very straight in a high-backed chair, reading. She is the daughter of Scipio Africanus, and everyone in Rome knows her name.",
            lines:[
              "You are the new scribe. You have a Cornelian name, I hear. So do I. We are both of us Scipio's people, in our way.",
              "When my husband died, the King of Egypt, Ptolemy, asked to marry me. I could have worn a crown. I said no, and I raised my twelve children here instead. Three are still living.",
              "Do you imagine I raised a son to be a king? Romans threw out their kings nearly four hundred years ago. My sons know that story better than anyone.",
              "I used to tell them it shamed me that Rome still called me the mother-in-law of Scipio, and not yet the mother of the Gracchi. Perhaps I should have kept my mouth shut. I am afraid for them now. I will not pretend I am not."
            ] } },

        { id:'jewel_box', label:'An Empty Jewel Box', x:0.185, y:0.79, type:'object', kind:'trivial', required:false,
          content:{ title:'An Empty Jewel Box',
            text:"A small ivory box on the side table, lined in red, and empty. The household tells the story fondly. A wealthy lady once visited and showed off her jewels, and asked to see Cornelia's. Cornelia waited until her sons came home from their lessons and said, 'These are my jewels.'" } },

        { id:'scribes', label:'The Scribes at Work', x:0.290, y:0.58, type:'object', kind:'clue', required:false,
          content:{ title:'The Scribes at Work',
            text:"Half a dozen scribes, slaves and freedmen like you, are bent over a long table copying claims. Each claim is a name, a tribe, a family, a story: 'Served at Carthage. Farm sold for debt.' 'Father killed in Spain.' 'Six children.' There are thousands of them in baskets on the floor.\n\nOne of the scribes hands you a stack without looking up. 'Copy these. Neatly. The commissioners can't read my writing.'" } },

        { id:'forma', label:'The Survey Map', x:0.385, y:0.72, type:'document', kind:'clue', required:false,
          content:{ title:'The Survey Map',
            text:"A great map drawn on linen and weighted at the corners, the commission's survey of public land around Rome. The surveyors have gridded the land into squares, and inside each square, smaller lots are numbered.\n\nIn the margin: LOTS NOT TO BE SOLD. Under the law, a man who receives a lot may not sell it, so the rich cannot simply buy it all back again.\n\nIn the corner of the map, a block of land on the Via Tiburtina has been outlined in red ink. Next to it, a name: P. SCIPIO NASICA." } },

        { id:'gaius', label:'The Younger Brother', x:0.455, y:0.55, type:'dialogue', kind:'clue', required:false,
          grants:['knows_estate'],
          content:{ title:'Gaius Gracchus',
            people:['Gaius Gracchus'],
            desc:"A young man of about twenty-one, with a surveyor's measuring cross over his shoulder and mud on his boots. He talks fast, with his hands.",
            lines:[
              "You are Arrius' scribe? Good, sit, there is a mountain to copy. I am Gaius, the brother. There are three of us on the commission: Tiberius, myself, and Appius Claudius, his father-in-law.",
              "Do you know where this started? Years ago, when my brother was going out to Spain, he rode up through Etruria. He told me there were no free men in the fields. None. Mile after mile of land worked by foreign slaves in chains. That was when he made up his mind.",
              "They say he wants a crown. He wants to measure land! You have seen what we do here. Lists and maps and measuring poles. Hardly the stuff of tyranny.",
              "The Senate could have done this themselves ten years ago. Laelius proposed it, and backed away when the great men shouted. Somebody had to stop backing away.",
              "If you doubt me, ride out the Via Tiburtina before tomorrow. Half a day. Look at the estate in red on that map, and then tell me who in this city wants to be king."
            ] } },

        { id:'blossius', label:'The Philosopher', x:0.590, y:0.55, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Blossius of Cumae',
            people:['Blossius of Cumae'],
            desc:"A bearded man in a Greek cloak with a scroll in one hand, an old friend and teacher of the tribune.",
            lines:[
              "I am Blossius, from Cumae. A Stoic, if you know what that means. We teach that all men share in reason, and so all men are, in a way, citizens of one city.",
              "The Senate looks at the Roman People the way a shepherd looks at his flock. Something to be kept, and shorn, and sent out to die when there is a war. Tiberius looks at them and sees citizens.",
              "Am I the one who put dangerous ideas in his head? I am flattered, but no. The idea that free men who fight for a country should own a piece of it is not Greek. It is the oldest Roman idea there is."
            ] } },

        { id:'stoic_scroll', label:'A Scroll of Philosophy', x:0.650, y:0.81, type:'document', kind:'herring', required:false,
          debunk:"'Only the wise man is a king' is a famous Stoic paradox, taught in philosophy schools all over the Greek world. It means that a person who rules his own passions is freer and greater than any king on a throne. It was a teaching about how to live, not a plan to seize power. Blossius did teach Tiberius, but nothing in the sources suggests he taught him to want a crown.",
          content:{ title:'A Scroll of Philosophy',
            text:"A Greek scroll lies unrolled on a reading stand, held open by two little lead weights. You read Greek slowly, but one line jumps out at you:\n\nONLY THE WISE MAN IS A KING.\n\nYour patron would like this very much." } },

        { id:'diophanes', label:'The Speechwriter', x:0.715, y:0.58, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Diophanes of Mytilene',
            people:['Diophanes of Mytilene'],
            desc:"A Greek rhetorician, exiled from his own city, scribbling on a wax tablet and crossing out more than he writes.",
            lines:[
              "Diophanes, of Mytilene. Teacher of speaking. I help the tribune find his words, and he throws most of them away and finds better ones.",
              "Tomorrow is the vote for next year's tribunes. He must stand again. If he leaves office, Quintus Pompeius has promised to prosecute him the day his term ends. They will try him for deposing Octavius, and they will win.",
              "So: stand again, which no tribune has done, and be called a tyrant. Or step down, and be destroyed. Which would you choose?"
            ] } },

        { id:'mural_crown', label:'A Golden Crown', x:0.800, y:0.31, type:'object', kind:'herring', required:false,
          debunk:"The gold crown in the niche was not a king's crown. Romans awarded a gold 'mural crown,' its points meant as the towers of a city wall, to the first soldier over the wall of an enemy city, and Plutarch says that Tiberius, at sixteen, was among the first over the walls of Carthage in 146 BC. The sources do not say whether he received one; the crown in this game is an invention. Either way, it was a soldier's decoration, not a king's.",
          content:{ title:'A Golden Crown',
            text:"There, in a niche high on the wall, in the tribune's own house: a crown. Gold, heavy, with a ring of points standing up around the rim, just like a king's.\n\nYour heart jumps. Then a house slave passing with a tray sees where you are looking. 'That's no king's crown. It's a wall crown, for the first man over an enemy's wall. The master was first up the wall at Carthage,' he says proudly. 'He was sixteen.'" } },

        { id:'pergamum_chest', label:'A Chest from Pergamum', x:0.885, y:0.75, type:'object', kind:'clue', required:false,
          content:{ title:'A Chest from Pergamum',
            text:"A cedar chest bound in bronze, carved with the royal star of Pergamum. This must be the chest Quintus Pompeius saw carried through the door.\n\nThe lid is not locked. Inside: rolled letters in Greek, sealed and unsealed, a list of the cities of the kingdom and their taxes, and a copy of the will of King Attalus, leaving his kingdom to the Roman People.\n\nNo diadem. No purple robe. Paper." } },

        { id:'claudia', label:"The Tribune's Wife", x:0.955, y:0.58, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Claudia',
            people:['Claudia'],
            desc:"A young woman holding a little boy by the hand, watching the door to the street.",
            lines:[
              "I am Claudia. My father is Appius Claudius, the leader of the Senate. He sits on the commission with my husband. Did your patron tell you that?",
              "The law was not written by one hot-headed young man. My father helped draft it. So did the consul himself, Mucius Scaevola, the finest lawyer in Rome. They are not wild men.",
              "But you would not know it from the way the senators talk. My father dines out less and less these days. Nobody invites him."
            ] } },

        { id:'house_back', label:'Back to the Forum', x:0.985, y:0.86, type:'navigation', goto:'forum_day' },

        { id:'sempronia', label:"The Tribune's Sister", x:0.520, y:0.62, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Sempronia',
            people:['Sempronia'],
            desc:"A woman sitting in the garden doorway, very still. She is the tribune's sister, married to the most famous general in Rome, Scipio Aemilianus, who is away in Spain besieging Numantia.",
            lines:[
              "I am Sempronia, his sister. Yes, another daughter named for the family. Every girl of the Sempronii is Sempronia.",
              "My husband destroyed Carthage. Now he is starving Numantia into surrender. His letters ask after my mother and never mention my brother. That is how I know what he thinks.",
              "My mother wanted sons who would be great. My husband wants a Rome that stays exactly as it is. I sit between them at dinner.",
              "If this ends badly, my husband will say Tiberius brought it on himself. And I will go on living in his house."
            ] } },

        { id:'cornelia_letters', label:'A Shelf of Letters', x:0.210, y:0.38, type:'object', kind:'trivial', required:false,
          content:{ title:"Cornelia's Letters",
            text:"A shelf of scrolls in a neat, firm hand: copies of Cornelia's letters, to her sons, to friends, to scholars. Her Latin is so fine that teachers have their pupils copy it. A hundred years from now the orator Cicero will praise her letters, and a few lines of one still survive today.\n\nVery few words written by Roman women have come down to us at all. Hers are among them." } },

        { id:'child_tablet', label:"A Child's Writing Tablet", x:0.775, y:0.85, type:'object', kind:'trivial', required:false,
          content:{ title:"A Child's Writing Tablet",
            text:"A small wax tablet dropped on the floor, covered in a child's wobbly letters: A B C D E F G H I K L M, and then, very proudly, ROMA.\n\nRomans write with a stylus, a pointed stick of bronze or bone, scratching letters into a thin layer of wax. Turn the stylus round and the flat end smooths the wax so you can start again. Rich children learn at home from a Greek slave tutor. Others go to a schoolmaster who teaches in a rented shop with a curtain across the front, and is quick with the cane." } }
      ]
    },

    vigil_night: {
      id: 'vigil_night',
      name: 'Outside the House of Gracchus',
      subtitle: 'The Night Before the Vote',
      actLabel: 'Act III - The Vigil',
      image: 'art/vigil_night.jpg',
      hotspots: [
        { id:'campfire_men', label:'Men by the Fire', x:0.120, y:0.76, type:'object', kind:'ambiance', required:false,
          content:{ title:'Men by the Fire',
            text:"Country men lie in their cloaks along the street, heads on their bundles, around a little fire of broken crates. Someone is passing a skin of sour wine. Nobody is singing. They are here to make sure that nothing happens to the house tonight, and they are taking it seriously." } },

        { id:'arrius_vigil', label:'Arrius and the Tribes', x:0.280, y:0.60, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Quintus Arrius',
            people:['Quintus Arrius'],
            desc:"Arrius, wax tablets under his arm, walking the line of sleepers and counting heads.",
            lines:[
              "You came. Good. Count with me. Pollia, eleven. Quirina, sixteen. Not enough. The harvest is keeping them home, just like the senators planned.",
              "At first light we go up the Capitol, to the open ground in front of the Temple of Jupiter. That is where the Assembly meets for the vote. We get there early and we hold the ground, so that when the tribes are called, our men are standing inside the ropes and not out in the street.",
              "No weapons. He was very clear about that. If anybody starts something, it will not be us.",
              "Sunrise. The Capitol. You will be there?"
            ] } },

        { id:'tiberius_door', label:'The Tribune at His Door', x:0.450, y:0.55, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Tiberius Gracchus',
            people:['Tiberius Gracchus'],
            desc:"Tiberius Gracchus stands in his own doorway in a dark, unwhitened toga, the clothes of mourning, holding a small boy by the hand. He looks out at the crowd in the street for a long time before he speaks.",
            lines:[
              "Friends. I have no guards but you. A tribune is sacred. Any man who lays a hand on him is cursed. But I do not think that will stop them now.",
              "If I am killed tomorrow, I ask one thing. This is my son. Look after him, and his mother. I have nothing else to leave him that they cannot take.",
              "Go to sleep, all of you. Tomorrow we vote. That is all we are going to do. We are going to vote."
            ] } },

        { id:'the_son', label:'The Boy', x:0.495, y:0.75, type:'object', kind:'ambiance', required:false,
          content:{ title:'The Boy',
            text:"The tribune's son, four or five years old, holding his father's hand and staring at the fires and the hundreds of strangers in the street. He is trying very hard to be brave. He does not quite understand what for." } },

        { id:'helmet', label:'A Helmet by the Door', x:0.560, y:0.84, type:'object', kind:'ambiance', required:false,
          content:{ title:'A Helmet by the Door',
            text:"An old soldier's helmet stands on the doorstep. A slave tells you in a whisper that a snake got into it in the night, and laid her eggs inside, and the eggs hatched. In the morning the sacred chickens would not eat. A bad sign, everybody says. The slave makes a sign against the evil eye and hurries in." } },

        { id:'villius', label:"The Tribune's Friend", x:0.625, y:0.62, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Gaius Villius',
            people:['Gaius Villius'],
            desc:"A stocky man keeping watch by the door, one of the tribune's oldest friends.",
            lines:[
              "Villius. I have known him since we were boys. He will not carry a sword tomorrow. I begged him to.",
              "Tomorrow, on the Capitol, the crowd will be so loud nobody will hear a word anybody says. So we agreed on signs. If he is in danger, if they are coming for his life, he will put his hand to his head, like this. Then we close in around him.",
              "That is all. A hand to the head. So we know."
            ] } },

        { id:'calvus', label:'A Loud Man', x:0.760, y:0.66, type:'dialogue', kind:'herring', noPoi:false, required:false,
          debunk:"Titus Calvus was the only man in Rome you heard call for a crown. He was not one of Tiberius' men. He was your patron's, paid to stand in the crowd and shout the word 'king' where witnesses could hear it.",
          content:{ title:'Titus Calvus',
            people:['Titus Calvus'],
            desc:"A big man with a loud voice and a fresh tunic, standing by the fire, slapping backs.",
            lines:[
              "Friend! Titus Calvus. Pour this man a cup! Tomorrow's the day, eh? Tomorrow we put Tiberius over all of them!",
              "Tribune? Why stop at tribune? Put a crown on his head, I say! King Tiberius! Let the senators choke on that!",
              "What? Why is everyone looking at me like that? Just talk, brothers. Just talk."
            ] } },

        { id:'naevia_vigil', label:'Naevia and Her Son', x:0.880, y:0.66, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Naevia',
            people:['Naevia'],
            desc:"The widow from the Subura sits on a doorstep across the street, her boy asleep with his head in her lap.",
            lines:[
              "He wanted to see the man who was going to give him a farm. I said we could not stay out all night. He said everybody else was.",
              "I cannot vote. I am a woman, and his father is dead. But I can sit here. Somebody has to see what happens to him tomorrow.",
              "Will you be up on the Capitol? Then look after them. Most of them have never been in a fight in the city. Only in wars."
            ] } },

        { id:'night_capitol', label:'The Capitol by Moonlight', x:0.930, y:0.18, type:'object', kind:'ambiance', required:false,
          goto:'fides_night', gotoText:'Climb the Capitol Before Dawn',
          gotoRequires:['arrius_vigil'],
          gotoNote:"Your patron will want your report before the Assembly meets. There will be no coming back down tonight.",
          gotoLocked:"Up there, at dawn, the Assembly will meet. You do not yet know what the tribune's people mean to do on the Capitol. Arrius is somewhere in the crowd, counting.",
          content:{ title:'The Capitol by Moonlight',
            text:"Above the rooftops, the Capitoline Hill, and on its summit the great Temple of Jupiter, best and greatest, pale in the moonlight. Beside it, on the slope, a smaller temple shows a light: the Temple of Fides, goddess of good faith. Somebody is awake up there too." } },

        { id:'moon_stars', label:'The Moon', x:0.620, y:0.07, type:'object', kind:'trivial', required:false,
          content:{ title:'The Moon',
            text:"A waning moon over the Palatine. Some of the country men are reading the stars to guess the hour. They have been doing it all their lives, for planting and for harvest, and they are never more than a little wrong." } },

        { id:'tertia_vigil', label:'Tertia', x:0.370, y:0.70, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Tertia',
            people:['Tertia'],
            desc:"The water girl from the Subura, out of breath, weaving between the sleepers.",
            lines:[
              "Arrius has had me running all night, courtyard to courtyard: which tribes are in, who's still on the road.",
              "Pollia is short. I told him. He swore by Hercules. Then he gave me a copper anyway.",
              "My mother thinks I'm asleep. I'll be back before she wakes up. Probably.",
              "Tomorrow I'm going to climb the wall by the Capitol steps and watch the whole thing. Nobody looks at a girl on a wall."
            ] } },

        { id:'dark_street', label:'The Dark Street', x:0.195, y:0.28, type:'object', kind:'trivial', required:false,
          content:{ title:'The Dark Street',
            text:"Away from the fires, the street is black. Rome has no street lamps, and no police force at all. People who can afford it go out at night with slaves carrying torches. Everyone else stays home and bars the door.\n\nIf there is trouble, a Roman calls on his family, his friends, his clients and his neighbours. That is all the protection there is. Tonight the tribune's friends are his only guard. Tomorrow the senators will bring theirs." } }
      ]
    },

    fides_night: {
      id: 'fides_night',
      name: 'The Temple of Fides',
      subtitle: 'The Capitol, Before Dawn',
      actLabel: 'Act III - Good Faith',
      image: 'art/fides_night.jpg',
      hotspots: [
        { id:'fides_back', label:'Back Down to the Vigil', x:0.025, y:0.82, type:'navigation', goto:'vigil_night' },

        { id:'scaevola', label:'The Consul', x:0.180, y:0.65, type:'dialogue', kind:'clue', noPoi:true, required:false,
          content:{ title:'Publius Mucius Scaevola',
            desc:"The consul, Rome's chief magistrate this year, sitting alone on a bench with a lamp, an old man in a fine toga. He is the most respected lawyer in the city.",
            lines:[
              "You are Nasica's freedman. He told me he had sent someone. He is waiting for your report, as if it will change anything.",
              "I helped Tiberius draft that law. I thought it was just. I still do. I do not like what he did to Octavius, and I do not like him standing again.",
              "Nasica asked me to use force against him. I told him what I will tell the Senate in the morning. I will not put a Roman citizen to death without a trial. If the People pass something unlawful, I will not enforce it. That is what the law allows me, and no more.",
              "Your patron thinks that answer is weakness. Your patron is a priest. He should know better what an oath is worth."
            ] } },

        { id:'pompeius_tablet', label:'A Speech, Drafted', x:0.270, y:0.79, type:'document', kind:'clue', required:false,
          content:{ title:'A Speech, Drafted',
            text:"A wax tablet left on a bench, written in a fast, angry hand. A speech for the Senate.\n\n...I am his neighbour, Conscript Fathers, and I tell you that Eudemus of Pergamum brought him a royal diadem and a purple robe, as to one who would soon be king...\n\nIn the margin, a note in a different hand: Q.P.: Need a witness who will swear to it. N. will supply one.\n\nN. is your patron. The witness is meant to be you." } },

        { id:'clubs', label:'A Pile of Staves', x:0.345, y:0.85, type:'object', kind:'clue', required:false,
          content:{ title:'A Pile of Staves',
            text:"Stacked in the shadow behind the columns: heavy wooden staves, cudgels, and the thick legs of benches, sawn short to make clubs. Dozens of them. Slaves in senatorial livery are carrying in more.\n\nNo swords. Swords are forbidden inside the sacred boundary of the city. Nobody said anything about clubs." } },

        { id:'informer_note', label:'A Tablet, Sealed', x:0.525, y:0.72, type:'document', kind:'clue', required:false,
          content:{ title:'A Tablet, Sealed',
            text:"A small tablet with the seal broken, in a rough hand.\n\nT. Calvus to P. Nasica, greeting. Names of the men around the tribune: Q. Arrius the veteran, who lists the country men by tribe. C. Villius. Blossius the Greek. Diophanes the Greek. The widow Naevia who sits at his door. I will be in the crowd tomorrow and do as agreed.\n\nBeneath, in your patron's hand: Paid Calvus 200 denarii. Promise him a farm.\n\nYour patron already has the names. What he wants from you is a sworn witness." } },

        { id:'fides_statue', label:'The Goddess', x:0.520, y:0.30, type:'object', kind:'ambiance', required:false,
          content:{ title:'Fides',
            text:"In the shadow of the temple stands the goddess Fides: Good Faith, Trust, the promise kept. Romans swear their treaties before her, and shake hands on their bargains in her name. Her right hand is held out, open.\n\nThe Senate will meet in her temple in the morning." } },

        { id:'nasica_ledger', label:"Your Patron's Ledger", x:0.445, y:0.71, type:'document', kind:'clue', required:false,
          content:{ title:"Your Patron's Ledger",
            text:"A slim account book in Hermon's familiar hand, brought up from the house with your patron's things.\n\nLANDS HELD, VIA TIBVRTINA. Private land, bought: 410 iugera. Public land, held by occupation: 2,640 iugera. Rent paid to the Treasury on public land, last thirty years: nothing.\n\nUnder the law of Gracchus: may keep 500, with allowance for two sons.\n\nAt the bottom, underlined twice, a single word: NEVER." } },

        { id:'satureius', label:'A Tribune with a Club', x:0.700, y:0.60, type:'dialogue', kind:'clue', required:false,
          content:{ title:'Publius Satureius',
            people:['Publius Satureius'],
            desc:"A man in a tribune's toga, testing the weight of a bench leg in his hand.",
            lines:[
              "Satureius. Tribune of the plebs, same as him. Surprised? Not every tribune thinks he is the voice of the People.",
              "A tribune is sacred, they say. Any man who lays hands on one is cursed. Well. Gracchus laid hands on Octavius, did he not? He broke the sacred thing first.",
              "Tell your patron I will be at his side. Tell him I will strike the first blow if I have to."
            ] } },

        { id:'sacred_geese', label:'The Sacred Geese', x:0.815, y:0.88, type:'object', kind:'trivial', required:false,
          content:{ title:'The Sacred Geese',
            text:"Juno's sacred geese, penned on the Capitol and fed at public expense, because once, long ago, when the Gauls crept up this hill at night, the geese woke the guards with their honking. Rome has paid for their dinner ever since. They are honking now. Nobody is listening." } },

        { id:'dawn', label:'First Light', x:0.930, y:0.36, type:'object', kind:'ambiance', required:false,
          content:{ title:'First Light',
            text:"Grey light behind the hills to the east. Down on the open ground before the Temple of Jupiter, the first of the crowd is arriving: Arrius' country men, tribe by tribe, carrying nothing but their cloaks. In an hour the Assembly will be called. In an hour the Senate will meet in here.\n\nYour report is due." } },

        { id:'priest_things', label:"The Chief Priest's Things", x:0.585, y:0.74, type:'object', kind:'trivial', required:false,
          content:{ title:"The Chief Priest's Things",
            text:"Laid out at the end of the table: a long-handled bronze ladle for pouring wine at a sacrifice, a sacrificial knife with an ivory handle, and a folded toga.\n\nYour patron is Pontifex Maximus, the head of Rome's priests. Roman priests are not a separate class of holy men. They are senators and politicians who also perform the state's sacrifices, read the omens, and keep the calendar. When a Roman sacrifices, he pulls a fold of his toga up over his head." } },

        { id:'fannia', label:'A Woman at the Door', x:0.855, y:0.62, type:'dialogue', kind:'ambiance', noPoi:true, required:false,
          content:{ title:'Fannia',
            desc:"A woman in a dark stola and veil, holding a little honey cake and a pinch of incense, waiting for the temple doors to open.",
            lines:[
              "I come at dawn to pray for my son. He votes today, for the first time. His father made him promise to vote as our patron tells him. He made me no promises at all.",
              "You think women don't matter in this? Sixty years ago, our grandmothers filled every street to the Forum, day after day, and stood outside the senators' doors until they repealed the law that forbade women to wear gold or ride in carriages. Old Cato made a speech against us. We won anyway.",
              "We cannot vote. But no man in Rome gets to the Assembly without walking out of some woman's door in the morning."
            ] } }
      ]
    }

  },

    verdict: {
      intro: "Your patron reads your tablets standing by a lamp, every word, slowly. Outside the temple doors the sky is going grey, and you can hear the crowd gathering on the hill.\n\nWhen he is done he closes the tablets and turns to you.\n\n'One question first, and answer me plainly, as a client to his patron. The Senate will ask me, and I will tell them what my witness says.' He lays his hand on your shoulder. 'Does Tiberius Gracchus mean to make himself king?'",

        { id:'yes',    label:'"Yes. He means to be king."', note:'Swear to it, as he asks.' },

    names: {
      intro: "'Good,' he says. 'Now the names. The Senate will want to know who stands with him, so that the consuls know whom to question, when this is over.'",
      introNo: "His hand drops from your shoulder. 'You disappoint me,' he says. 'No matter. A witness is useful, but not necessary.' He holds out his hand. 'The names, at least. You owe me that much.'",
      note: "Your patron will act on every name you give him. Anyone you marked as a Person of Interest in your notebook is named already. Change anything you like.",
      listLabel: 'The Tribe Lists (212 names)',
      listNote: 'Copied from the courtyard in the Subura',

    },

    reaction: {
      accuse: "You tell him what you have seen behind the columns of this temple, and what you have read on his table.\n\nFor a moment your patron says nothing at all. Then he takes his hand from your shoulder and wipes it on his toga.\n\n'I freed you,' he says quietly. 'I gave you my name. And you stand in the temple of Good Faith and lecture me about the Republic.' He turns to the slaves at the door. 'Put him out.'\n\nThey put you out, onto the steps, into the grey light, among the crowd.",
      names: "Your patron reads down the names and nods. 'Good. You have done the Republic a service.' He gives the tablets to a slave to be copied for the consuls. He is already turning away as the senators begin to arrive.",
      namesNo: "He takes the names without a word and hands them to a slave to be copied for the consuls. He does not look at you again.",
      none: "You give him no names. He looks at you for a long moment. 'I see,' he says. 'Then go. I will remember this.' He does not offer his hand.",
      calvusNames: "The names you give him are the same names Titus Calvus sold him for two hundred denarii. What your patron needed from you was never the names. It was a sworn witness to set beside them.",
      calvusNone: "He has Calvus' names already. But a hired shouter is not a witness, and he knows it."
    },
    calvusList: ['Quintus Arrius', 'Gaius Villius', 'Blossius of Cumae', 'Diophanes of Mytilene', 'Naevia'],

    // What the player hears of the morning on the Capitol, by verdict.
    capitol: {
      yes: "The Senate met in the Temple of Fides with the doors open. Out on the hill, the Assembly was already in uproar, so loud that the tribune could not make himself heard. A senator named Fulvius Flaccus pushed through the crowd to warn him: the senators meant to kill him. Tiberius, unable to be heard, put his hand to his head.\n\nThose who had agreed on that sign knew what it meant. His enemies ran to the Senate and said he was asking for a crown.\n\nYour patron rose. 'He is asking for a diadem. I have a sworn witness, a man who has been among them.' He turned to the consul and demanded that he act. Scaevola refused. He would not put a citizen to death without a trial.\n\n'Then the consul has betrayed the city,' said your patron. 'Let those who would save the Republic follow me.' He drew the fold of his toga over his head, as a priest does at a sacrifice, and walked out of the temple. The senators followed him, and their slaves followed them, carrying the clubs.",
      no: "The Senate met in the Temple of Fides with the doors open. Out on the hill, the Assembly was already in uproar, so loud that the tribune could not make himself heard. A senator named Fulvius Flaccus pushed through the crowd to warn him: the senators meant to kill him. Tiberius, unable to be heard, put his hand to his head.\n\nYou know what it meant. Villius told you. His enemies ran to the Senate and said he was asking for a crown.\n\nYour patron did not need your oath after all. Titus Calvus had been shouting 'king' in the crowd all morning, and that was witness enough. Your patron demanded that the consul act. Scaevola refused. 'Then the consul has betrayed the city,' said your patron. 'Let those who would save the Republic follow me.' He drew the fold of his toga over his head, as a priest does at a sacrifice, and walked out. The senators followed him, and their slaves followed them, carrying the clubs.",
      accuse: "You were standing on the steps when it happened, close enough to see everything.\n\nThe Assembly was in uproar, so loud the tribune could not make himself heard. Tiberius put his hand to his head. You knew what it meant. So did Villius, beside him, and so did Arrius. But somebody ran into the temple shouting that he was asking for a crown.\n\nA moment later your patron came out of the doors with the fold of his toga drawn over his head, like a priest going to a sacrifice, and the senators came behind him, and their slaves came behind them with the clubs. You shouted. Nobody heard you either."
    },
    death: "The crowd gave way before the senators. Nobody dared strike a man in a senator's toga. The senators' men picked up the broken legs of benches and went in among the people.\n\nTiberius Gracchus was struck down near the doors of the Temple of Jupiter. The first blow was struck by Publius Satureius, a tribune like himself. More than three hundred people were killed that morning, with clubs and stones. Not one of them by a sword.\n\nThat night the bodies were thrown into the Tiber. His brother Gaius asked to bury him, and was refused.",

    // Fates of anyone named, from the special court the consuls of the next year set up to try
    // the tribune's followers. breaks:true marks the people who held the movement together.
    fates: {
      'Tiberius Gracchus':      { text:"You gave them the one name they already had. It made no difference to him. It made a difference to you: in the record, yours is one of the names that called him a danger to the Republic." },
      'Quintus Arrius':         { breaks:true, text:"Quintus Arrius was brought before the consuls' court the next spring. He told them he had kept lists of voters, which was true and was not a crime. He was condemned anyway and forbidden fire and water: exile, on pain of death. He went to live among the Marsians, who took him in. He never saw a farm of his own." },
      'Naevia':                 { text:"Naevia could not be tried. She was a woman, and had done nothing. But her son's claim was struck off the commission's rolls, and the rent collector raised her rent until she left the courtyard. Nobody in the Subura knew where she went." },
      'Gaius Villius':          { breaks:true, text:"Gaius Villius was condemned by the consuls' court. The story told afterwards was that they shut him in a cask with vipers. It may not be true. That people believed it says enough about that year." },
      'Blossius of Cumae':      { text:"Blossius was brought before the consuls. Asked whether he would have done anything Tiberius told him, he said yes. 'What if he had told you to burn the Capitol?' your patron asked. 'He would never have told me that,' said Blossius. They let him go. He sailed for Asia and joined a pretender fighting Rome for the throne of Pergamum, and when that war was lost he killed himself." },
      'Diophanes of Mytilene':  { text:"Diophanes the rhetorician was put to death. He had written speeches." },
      'Gaius Gracchus':         { text:"Nobody dared touch Gaius. He was twenty-one, and Cornelia's son, and the people's darling. But they wrote his name down, and they kept it." },
      'Cornelia':               { text:"Your patron read her name and set it aside. 'The daughter of Africanus,' he said. 'Nobody will lay a hand on her.' Nobody did. She outlived both her sons." },
      'Claudia':                { text:"Claudia was the daughter of the leader of the Senate. Her name was never even read aloud." },
      'Sextus Lollius':         { breaks:true, text:"Sextus Lollius was arrested before he got home to Reate, tried, and exiled. His wife brought in the harvest alone." },
      'Philo the Money-Changer':{ text:"Philo was questioned for an afternoon and sent back to his scales. He had only been talking about the price of bread." },
      'Gnaeus the Rent Collector': { text:"Gnaeus was questioned and released. He raised the rents again that winter." },
      'Old Tullus':             { text:"The overseer had a name now. In the autumn, a fire started in Old Tullus' barn, and the estate bought his seven iugera at a fair price from a frightened old man." },
      'Damon the Overseer':     { text:"Damon belonged to your patron. Your patron had him whipped for talking to a stranger about the master's business, and sold him to an estate in the south." },
      'Syrus':                  { text:"Syrus belonged to your patron. On the strength of your report he was sold to a dealer bound for Sicily, where the slave war had just been put down and the estates needed hands." },
      'Herius the Marsian':     { text:"Herius the Marsian had opposed the law. The consuls' court did not care. He was not a Roman citizen, so they could not try him, and he went back to his mountains with a story about how Rome treats its allies. Forty years later, the Marsians would lead the allies in a war against Rome to win the right to vote." },
      'Titus Calvus':           { text:"You named Titus Calvus. Your patron only smiled. Calvus had been his man all along. He got his farm: thirty iugera of public land, on the Via Tiburtina." },
      'Hermon the Steward':     { text:"Your patron read Hermon's name twice. The old steward who had been kind to you when you were small, who had told you where to look, was sold to a dealer before the month was out. He never knew who had named him." },

// =============================================================
// PANNING
// =============================================================
const pan = {
  x: 0, minX: 0, maxX: 0,
  dragging: false,
  startMX: 0, startPX: 0,
  moved: false,
  imgW: 0
};

// A press may drift this many pixels and still count as a click rather than a drag.
const DRAG_THRESHOLD = 10;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function isDesktopDocked() { return window.innerWidth >= 1000; }
function getGameWidth()    { return window.innerWidth - (isDesktopDocked() ? 380 : 0); }

function applyDockedLayout() {
  const docked = isDesktopDocked();
  const vp = document.getElementById('game-viewport');
  const nb = document.getElementById('notebook');
  const toggle = document.getElementById('nb-toggle');
  const nbClose = document.getElementById('nb-close');
  if (docked) {
    vp.style.right = '380px';
    nb.style.right = '0';
    nb.style.width = '380px';
    nb.classList.add('open');
    toggle.style.display = 'none';
    nbClose.style.display = 'none';
  } else {
    vp.style.right = '0';
    nb.style.width = '';
    nb.style.right = '';
    nb.classList.toggle('open', gameState.notebookOpen);
    toggle.style.display = '';
    nbClose.style.display = '';
  }
}

function setPan(x, animate) {
  x = clamp(x, pan.minX, pan.maxX);
  pan.x = x;
  const c = document.getElementById('panorama-container');
  c.style.transition = animate ? 'transform 0.28s ease-out' : 'none';
  c.style.transform  = `translateX(${x}px)`;
  updateScrollThumb();
  updateChevrons();
}

function panBy(dx, animate) { setPan(pan.x + dx, animate); }

function computeBounds() {
  const vw = getGameWidth();
  const img = document.getElementById('scene-image');
  let iw;
  if (img.naturalWidth) {
    iw = img.naturalWidth * (window.innerHeight / img.naturalHeight);
  } else {
    iw = vw * 3.18; // fallback ratio
  }
  pan.imgW = iw;
  pan.minX = Math.min(0, vw - iw);
  pan.maxX = 0;
  document.getElementById('panorama-container').style.width = iw + 'px';
  // Start near the left edge, where each scene's first conversation is
  const startX = pan.minX * 0.08;
  setPan(startX, false);
}

function updateScrollThumb() {
  const track = document.getElementById('scroll-track');
  const thumb = document.getElementById('scroll-thumb');
  const range = pan.minX - pan.maxX; // negative number, range magnitude
  if (!range) { thumb.style.width = '100%'; thumb.style.left = '0'; return; }
  const ratio  = pan.imgW / getGameWidth();
  const pct    = Math.max(8, 100 / ratio);
  const prog   = pan.maxX === pan.minX ? 0 : (pan.x - pan.maxX) / (pan.minX - pan.maxX);
  const tw     = track.offsetWidth;
  thumb.style.width = pct + '%';
  thumb.style.left  = (prog * (tw - tw * pct / 100)) + 'px';
}

function updateChevrons() {
  document.getElementById('chev-left').classList.toggle('edge',  pan.x >= pan.maxX - 2);
  document.getElementById('chev-right').classList.toggle('edge', pan.x <= pan.minX + 2);
}
