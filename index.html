<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Regnum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0908;
  background-color: #0a0908;
  font-family: 'Libre Baskerville', serif;
}

/* VIEWPORT & PANORAMA */
#game-viewport {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  overflow: hidden;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  background-color: #0a0908;
}
#game-viewport.dragging { cursor: grabbing; }

#panorama-container {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  will-change: transform;
}

#scene-image {
  height: 100%;
  width: auto;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

#hotspot-layer {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  pointer-events: none;
}

/* HOTSPOTS */
.hotspot {
  position: absolute;
  width: 26px; height: 26px;
  transform: translate(-50%, -50%);
  pointer-events: all;
  cursor: pointer;
  z-index: 10;
}
.hotspot-glow {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,185,55,0.95) 0%, rgba(255,140,20,0.45) 55%, transparent 100%);
  animation: hotspot-pulse 2.5s ease-in-out infinite;
  transition: transform 0.2s ease, opacity 0.3s;
}
.hotspot:hover .hotspot-glow {
  transform: scale(1.5);
  animation-play-state: paused;
  opacity: 1;
}
.hotspot.extra { width: 20px; height: 20px; }
.hotspot.extra .hotspot-glow {
  background: radial-gradient(circle, rgba(185,225,255,0.95) 0%, rgba(120,175,230,0.45) 55%, transparent 100%);
}
.hotspot.extra.found .hotspot-glow {
  background: radial-gradient(circle, rgba(150,170,190,0.6) 0%, rgba(120,140,160,0.22) 55%, transparent 100%);
}
#evidence-card.is-extra .card-type-tag { color: #4a6f8f; }
.hotspot.found .hotspot-glow {
  background: radial-gradient(circle, rgba(90,130,95,0.65) 0%, rgba(70,110,75,0.25) 55%, transparent 100%);
  animation-duration: 5s;
}
@keyframes hotspot-pulse {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50%       { opacity: 0.75; transform: scale(1.15); }
}

/* VIGNETTE */
#vignette {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  pointer-events: none;
  box-shadow: inset 0 0 140px rgba(0,0,0,0.72), inset 0 0 50px rgba(0,0,0,0.45);
  z-index: 20;
}

/* LOCATION LABEL */
#location-label {
  position: fixed;
  top: 18px; left: 22px;
  z-index: 30;
  pointer-events: none;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 14px rgba(0,0,0,0.85);
}
#loc-name {
  display: block;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  font-variant: small-caps;
  letter-spacing: 2.5px;
  color: #d4c4a0;
  line-height: 1.5;
}
#loc-sub {
  display: block;
  font-family: 'Libre Baskerville', serif;
  font-size: 10px;
  color: rgba(212,196,160,0.78);
  letter-spacing: 1.2px;
  font-style: italic;
}
#loc-act {
  display: block;
  margin-top: 5px;
  font-family: 'Libre Baskerville', serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(212,196,160,0.66);
}

/* CHEVRONS */
.chevron {
  position: fixed;
  top: 50%; transform: translateY(-50%);
  z-index: 30;
  background: none; border: none;
  color: rgba(212,196,160,0.4);
  font-size: 52px;
  cursor: pointer;
  padding: 10px 14px;
  line-height: 1;
  transition: color 0.25s, opacity 0.4s;
  font-family: serif;
  min-height: 44px; min-width: 44px;
}
.chevron:hover { color: rgba(212,196,160,0.85); }
#chev-left  { left: 2px; }
#chev-right { right: 2px; }
.chevron.edge { opacity: 0; pointer-events: none; }

/* SCROLL INDICATOR */
#scroll-wrap {
  position: fixed;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  width: 180px;
  pointer-events: none;
}
#scroll-track {
  height: 2px;
  background: rgba(212,196,160,0.18);
  border-radius: 1px;
  position: relative;
}
#scroll-thumb {
  height: 100%;
  background: rgba(212,196,160,0.55);
  border-radius: 1px;
  position: absolute; top: 0;
  transition: left 0.05s linear;
}

/* EVIDENCE CARD OVERLAY */
#card-overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  pointer-events: none;
  background: rgba(0,0,0,0);
  transition: background 0.3s;
}
#card-overlay.open {
  background: rgba(0,0,0,0.76);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  pointer-events: all;
}

#evidence-card {
  position: relative;
  max-width: 540px; width: 100%;
  max-height: 88vh; overflow-y: auto;
  padding: 28px 32px 24px;
  border-radius: 2px;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.28s ease, transform 0.28s ease;
  box-shadow: 0 10px 50px rgba(0,0,0,0.65), 0 2px 8px rgba(0,0,0,0.4);
}
#card-overlay.open #evidence-card { opacity: 1; transform: translateY(0); }

#evidence-card.type-dialogue {
  background: radial-gradient(ellipse at 15% 85%, rgba(160,110,50,0.09) 0%, transparent 55%), #f5ebce;
}
#evidence-card.type-document {
  background: radial-gradient(ellipse at 85% 15%, rgba(100,90,70,0.07) 0%, transparent 55%), #f0edd8;
}
#evidence-card.type-object {
  background: radial-gradient(ellipse at 50% 90%, rgba(140,100,50,0.09) 0%, transparent 55%), #f5edd6;
}

#card-close {
  position: absolute; top: 10px; right: 12px;
  background: none; border: none;
  font-size: 24px; color: #9a7a5a;
  cursor: pointer; line-height: 1;
  padding: 4px 8px; min-width: 32px; min-height: 32px;
  transition: color 0.2s;
}
#card-close:hover { color: #3a2a1a; }

.card-type-tag {
  display: block;
  font-size: 9px; letter-spacing: 2.5px;
  text-transform: uppercase;
  color: #9a7850; font-family: 'Libre Baskerville', serif;
  margin-bottom: 7px;
}
.card-title {
  font-family: 'Cinzel', serif;
  font-size: 20px; font-weight: 700;
  color: #251508; line-height: 1.3;
  margin-bottom: 4px;
}
.card-desc {
  font-style: italic; font-size: 13px;
  color: #6a4828; margin-bottom: 14px; line-height: 1.55;
  font-family: 'Libre Baskerville', serif;
}
.card-rule {
  border: none; border-top: 1px solid rgba(100,70,35,0.22);
  margin: 0 0 14px;
}
.card-line {
  font-size: 14.5px; color: #3a2a1a;
  line-height: 1.75; margin-bottom: 10px;
  font-style: italic;
  font-family: 'Libre Baskerville', serif;
}
.card-line:last-of-type { margin-bottom: 0; }
.card-speaker {
  display: block; margin-bottom: 1px;
  font-style: normal; font-size: 9.5px;
  letter-spacing: 1.8px; text-transform: uppercase;
  color: #9a7850;
}
.card-body {
  font-size: 13.5px; color: #3a2a1a;
  line-height: 1.82; white-space: pre-line;
  font-family: 'Libre Baskerville', serif;
}

.card-transition-btn {
  display: block;
  margin-top: 20px;
  width: 100%;
  background: linear-gradient(180deg, #594618 0%, #382c0e 100%);
  border: 1px solid #897035;
  color: #d4c4a0;
  padding: 12px 20px;
  font-family: 'Cinzel', serif;
  font-size: 14px; letter-spacing: 1px;
  cursor: pointer; border-radius: 1px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,215,100,0.1);
  transition: background 0.2s;
  min-height: 44px;
}
.card-transition-btn:hover {
  background: linear-gradient(180deg, #6a5520 0%, #463a14 100%);
  border-color: #a09040;
}

#card-added {
  margin-top: 18px;
  font-size: 11.5px; color: #5a7a5a;
  font-style: italic; letter-spacing: 0.5px;
  opacity: 0; transition: opacity 0.5s 0.25s;
  font-family: 'Libre Baskerville', serif;
}
#card-added.show { opacity: 1; }

/* NOTEBOOK SIDEBAR */
#notebook {
  position: fixed; top: 0; right: -380px;
  width: 360px; height: 100%;
  background: #14110e;
  border-left: 1px solid rgba(212,196,160,0.1);
  z-index: 200;
  display: flex; flex-direction: column;
  transition: right 0.32s cubic-bezier(0.25,0.46,0.45,0.94);
}
#notebook.open { right: 0; }

#nb-header {
  padding: 18px 18px 15px;
  border-bottom: 1px solid rgba(212,196,160,0.12);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#nb-header span {
  font-family: 'Cinzel', serif;
  font-size: 15px; font-variant: small-caps;
  letter-spacing: 1.8px; color: #d4c4a0;
}
#nb-close {
  background: none; border: none;
  color: rgba(212,196,160,0.45); font-size: 22px;
  cursor: pointer; padding: 4px 8px;
  min-width: 36px; min-height: 36px;
  transition: color 0.2s;
}
#nb-close:hover { color: #d4c4a0; }

#nb-loc {
  padding: 14px 18px 6px;
  font-size: 9px; letter-spacing: 2.5px;
  text-transform: uppercase; color: rgba(212,196,160,0.35);
  font-family: 'Libre Baskerville', serif;
  flex-shrink: 0;
}

#nb-scroll-area {
  flex: 1; overflow-y: auto; padding: 4px 0 16px;
}

.nb-section-head {
  padding: 10px 18px 4px;
  font-size: 9px; letter-spacing: 2.5px;
  text-transform: uppercase; font-variant: small-caps;
  color: rgba(212,196,160,0.38);
  font-family: 'Libre Baskerville', serif;
  border-top: 1px solid rgba(212,196,160,0.08);
  margin-top: 4px;
}
#nb-people-section .nb-section-head { border-top: none; margin-top: 0; }

/* Person card */
.nb-person-card {
  padding: 10px 18px 12px;
  border-bottom: 1px solid rgba(212,196,160,0.06);
}
.nb-person-name {
  background: none; border: none;
  font-family: 'Libre Baskerville', serif;
  font-size: 13px; color: rgba(212,196,160,0.85);
  cursor: pointer; text-align: left;
  padding: 0; min-height: 44px;
  width: 100%; line-height: 1.4;
  transition: color 0.18s;
}
.nb-person-name:hover { color: #d4c4a0; text-decoration: underline; }

/* POI slider */
.nb-poi-wrap {
  margin-top: 6px;
}
.nb-poi-slider {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(212,196,160,0.15);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.nb-poi-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #c9a84c;
  border: 2px solid #e0c060;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.nb-poi-slider::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #c9a84c;
  border: 2px solid #e0c060;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.nb-poi-label {
  font-size: 9.5px;
  color: rgba(212,196,160,0.45);
  font-family: 'Libre Baskerville', serif;
  letter-spacing: 0.8px;
  margin-top: 3px;
  font-style: italic;
}

/* Notes textarea */
.nb-notes {
  width: 100%;
  margin-top: 7px;
  background: #1e1810;
  border: 1px solid rgba(212,196,160,0.18);
  border-radius: 2px;
  color: rgba(212,196,160,0.75);
  font-family: 'Libre Baskerville', serif;
  font-size: 11.5px;
  line-height: 1.55;
  padding: 6px 8px;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
}
.nb-notes::placeholder { color: rgba(212,196,160,0.25); font-style: italic; }
.nb-notes:focus { border-color: rgba(212,196,160,0.4); }

.nb-entry {
  padding: 11px 18px;
  cursor: pointer;
  border-bottom: 1px solid rgba(212,196,160,0.06);
  display: flex; align-items: center; gap: 11px;
  transition: background 0.18s;
}
.nb-entry:hover { background: rgba(212,196,160,0.05); }

.nb-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.nb-dot.dialogue { background: rgba(200,160,80,0.6); }
.nb-dot.document { background: rgba(130,110,170,0.55); }
.nb-dot.object   { background: rgba(100,160,105,0.55); }

.nb-info {}
.nb-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 12.5px; color: rgba(212,196,160,0.8);
  line-height: 1.4;
}
.nb-type {
  font-size: 9px; color: rgba(212,196,160,0.3);
  letter-spacing: 1.5px; text-transform: uppercase;
  margin-top: 1px;
  font-family: 'Libre Baskerville', serif;
}

#nb-empty {
  padding: 24px 18px;
  font-size: 12px; font-style: italic;
  color: rgba(212,196,160,0.28);
  font-family: 'Libre Baskerville', serif;
}

/* NOTEBOOK TABS */
#nb-tabs {
  display: flex;
  border-bottom: 1px solid rgba(212,196,160,0.12);
  flex-shrink: 0;
  padding: 0 8px;
  gap: 2px;
}
.nb-tab {
  position: relative;
  background: none; border: none;
  border-bottom: 2px solid transparent;
  color: rgba(212,196,160,0.4);
  font-family: 'Libre Baskerville', serif;
  font-size: 9.5px; letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 9px 12px 7px;
  cursor: pointer; min-height: 44px;
  transition: color 0.18s, border-color 0.18s;
}
.nb-tab.active { color: #d4c4a0; border-bottom-color: #c9a84c; }
.nb-tab:hover:not(.active) { color: rgba(212,196,160,0.7); }
.nb-new-dot {
  position: absolute; top: 9px; right: 5px;
  width: 6px; height: 6px; border-radius: 50%;
  background: #c9a84c;
  box-shadow: 0 0 4px rgba(201,168,76,0.7);
}

/* FINAL REPORT PANEL */
#nb-report-area {
  flex: 1; overflow-y: auto;
  padding: 14px 14px 20px;
  display: none;
}
.report-form {
  background: #f0e6c8;
  border: 1px solid #b89a55;
  border-radius: 2px;
  padding: 18px 16px 20px;
  color: #1e1404;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
}
.report-form-title {
  font-family: 'Cinzel', serif;
  font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase; text-align: center;
  color: #1e1404; margin-bottom: 3px;
}
.report-form-sub {
  font-family: 'Libre Baskerville', serif;
  font-size: 9px; letter-spacing: 1.5px;
  text-transform: uppercase; text-align: center;
  color: rgba(30,20,4,0.5); margin-bottom: 14px;
  font-style: italic;
}
.report-rule {
  border: none; border-top: 1px solid rgba(30,20,4,0.18);
  margin: 0 0 14px;
}
.report-field { margin-bottom: 12px; }
.report-label {
  display: block;
  font-family: 'Libre Baskerville', serif;
  font-size: 8.5px; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(30,20,4,0.55);
  margin-bottom: 4px;
}
.report-textarea {
  width: 100%; box-sizing: border-box;
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(30,20,4,0.18);
  border-radius: 1px;
  color: #120d02;
  font-family: 'Libre Baskerville', serif;
  font-size: 12px; line-height: 1.6;
  padding: 7px 9px; resize: none; outline: none;
  transition: border-color 0.2s;
}
.report-textarea:focus { border-color: rgba(30,20,4,0.45); }
.report-textarea::placeholder { color: rgba(30,20,4,0.28); font-style: italic; }
.report-submit-btn {
  width: 100%; min-height: 44px;
  background: rgba(30,20,4,0.08);
  border: 1px solid rgba(30,20,4,0.22);
  color: rgba(30,20,4,0.35);
  font-family: 'Cinzel', serif;
  font-size: 12px; letter-spacing: 1px;
  padding: 12px 20px; border-radius: 1px;
  cursor: not-allowed; margin-top: 4px;
}
.report-submit-caption {
  font-family: 'Libre Baskerville', serif;
  font-size: 9px; color: rgba(30,20,4,0.38);
  text-align: center; margin-top: 8px;
  font-style: italic; line-height: 1.5;
}

/* NOTEBOOK TOGGLE */
#nb-toggle {
  position: fixed; top: 18px; right: 18px;
  z-index: 150;
  background: rgba(24,18,11,0.92);
  border: 1px solid rgba(212,196,160,0.22);
  color: #d4c4a0;
  padding: 8px 13px;
  cursor: pointer;
  font-family: 'Libre Baskerville', serif;
  font-size: 11px; letter-spacing: 1px;
  display: flex; align-items: center; gap: 7px;
  min-height: 44px; border-radius: 1px;
  transition: background 0.2s, border-color 0.2s;
}
#nb-toggle:hover {
  background: rgba(38,28,16,0.96);
  border-color: rgba(212,196,160,0.45);
}
#nb-toggle.has-news::after {
  content: ''; position: absolute; top: 5px; right: 5px;
  width: 7px; height: 7px; border-radius: 50%;
  background: #c9a84c; box-shadow: 0 0 4px rgba(201,168,76,0.8);
}
#nb-badge {
  background: rgba(212,196,160,0.14);
  border-radius: 50%;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; color: #d4c4a0;
}

/* PROGRESSION BUTTON */
#progress-btn {
  position: fixed; bottom: 34px; left: 50%;
  transform: translateX(-50%) translateY(22px);
  z-index: 50;
  background: linear-gradient(180deg, #594618 0%, #382c0e 100%);
  border: 1px solid #897035;
  color: #d4c4a0;
  padding: 13px 30px;
  font-family: 'Cinzel', serif;
  font-size: 14px; letter-spacing: 1px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.55s ease, transform 0.55s ease;
  min-height: 44px; border-radius: 1px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,215,100,0.1);
  pointer-events: none;
}
#progress-btn.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: all;
}
#progress-btn:hover {
  background: linear-gradient(180deg, #6a5520 0%, #463a14 100%);
  border-color: #a09040;
}

/* TRANSITION SCREEN */
#transition {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  background: #0a0908;
  z-index: 500;
  opacity: 0; pointer-events: none;
  transition: opacity 0.7s;
  display: flex; align-items: center; justify-content: center;
}
#transition.on { opacity: 1; pointer-events: all; }
#trans-inner { text-align: center; opacity: 0; transition: opacity 0.5s 0.55s; }
#transition.on #trans-inner { opacity: 1; }
.trans-act {
  font-family: 'Libre Baskerville', serif;
  font-size: 11px; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(212,196,160,0.45);
  margin-bottom: 14px;
}
.trans-title {
  font-family: 'Cinzel', serif;
  font-size: 30px; color: #d4c4a0; margin-bottom: 8px;
}
.trans-sub {
  font-family: 'Libre Baskerville', serif;
  font-size: 13px; font-style: italic;
  color: rgba(212,196,160,0.5);
}

/* SCROLLBARS */
#nb-scroll-area::-webkit-scrollbar,
#evidence-card::-webkit-scrollbar { width: 3px; }
#nb-scroll-area::-webkit-scrollbar-track,
#evidence-card::-webkit-scrollbar-track { background: transparent; }
#nb-scroll-area::-webkit-scrollbar-thumb,
#evidence-card::-webkit-scrollbar-thumb {
  background: rgba(212,196,160,0.2); border-radius: 2px;
}

/* DESKTOP DOCKED NOTEBOOK */
@media (min-width: 1000px) {
  #notebook {
    right: 0 !important;
    width: 380px !important;
    transition: none;
  }
  #nb-toggle { display: none !important; }
  #nb-close  { display: none !important; }
  #game-viewport { right: 380px; }
  #vignette { right: 380px; }
  #card-overlay { right: 380px; }
  #scroll-wrap { left: calc(50% - 190px); }
  #chev-right { right: 382px; }
}

/* MOBILE */
@media (max-width: 500px) {
  #notebook { width: 100%; right: -100%; }
  #evidence-card { padding: 20px 18px; }
  .card-title { font-size: 17px; }
  .card-body, .card-line { font-size: 13px; }
  #nb-toggle { top: 14px; right: 14px; }
}

/* NAVIGATION HOTSPOTS */
.hotspot.nav-hotspot {
  width: 48px; height: 48px;
  transform: translate(-50%, -50%);
}
.hotspot.nav-hotspot .hotspot-glow {
  background: radial-gradient(circle, rgba(150,210,240,0.95) 0%, rgba(80,155,200,0.45) 55%, transparent 100%);
  animation: nav-pulse 3s ease-in-out infinite;
}
.hotspot.nav-hotspot:hover .hotspot-glow {
  transform: scale(1.4);
  animation-play-state: paused;
  opacity: 1;
}
@keyframes nav-pulse {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50%       { opacity: 0.85; transform: scale(1.2); }
}
.hotspot-nav-label {
  position: absolute;
  top: calc(100% + 5px); left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: 'Libre Baskerville', serif;
  font-size: 10px; font-style: italic;
  color: rgba(170,215,240,0.9);
  text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.8);
  letter-spacing: 0.3px;
  pointer-events: none;
}

/* ── TUNE MODE ────────────────────────────────────────────── */
body.tune-mode #game-viewport { cursor: crosshair; }
body.tune-mode .hotspot { display: none; }

#tune-banner {
  display: none;
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 900;
  background: rgba(160,30,30,0.95);
  color: #fff;
  font-family: 'Libre Baskerville', serif;
  font-size: 13px;
  padding: 10px 14px;
  display: none;
  align-items: center;
  gap: 10px;
}
body.tune-mode #tune-banner { display: flex; }
#tune-prompt {
  flex: 1;
  font-style: italic;
  line-height: 1.3;
}
#tune-skip-btn {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  color: #fff; font-family: 'Libre Baskerville', serif;
  font-size: 11px; padding: 4px 10px; cursor: pointer; border-radius: 1px;
  white-space: nowrap;
}
#tune-skip-btn:hover { background: rgba(255,255,255,0.28); }

.tune-marker {
  position: absolute;
  width: 28px; height: 28px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 800;
}
.tune-marker-ring {
  position: absolute; inset: 0;
  border: 2px solid rgba(255,80,80,0.9);
  border-radius: 50%;
}
.tune-marker-dot {
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  background: rgba(255,80,80,1);
  border-radius: 50%;
  transform: translate(-50%,-50%);
}
.tune-marker-label {
  position: absolute;
  top: -18px; left: 50%;
  transform: translateX(-50%);
  font-family: monospace;
  font-size: 11px;
  color: #ff6060;
  white-space: nowrap;
  text-shadow: 0 1px 3px #000, 0 0 6px #000;
}

#tune-panel {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 900;
  background: rgba(10,8,6,0.97);
  border-top: 1px solid rgba(255,80,80,0.4);
  max-height: 42vh;
  overflow-y: auto;
  padding: 12px 16px 16px;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}
body.tune-mode #tune-panel { display: block; }
body.tune-mode #tune-panel.open { transform: translateY(0); }

/* pull-up tab, always visible in tune mode */
#tune-tab {
  display: none;
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  z-index: 901;
  background: rgba(160,30,30,0.92);
  color: rgba(255,200,200,0.9);
  font-family: 'Libre Baskerville', serif;
  font-size: 11px; letter-spacing: 1px;
  padding: 5px 18px 4px;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  white-space: nowrap;
}
body.tune-mode #tune-tab { display: block; }

#tune-panel h3 {
  font-family: 'Cinzel', serif;
  font-size: 13px; color: rgba(255,120,120,0.9);
  margin-bottom: 10px; letter-spacing: 1px;
  display: flex; justify-content: space-between; align-items: center;
}
#tune-copy-btn {
  background: rgba(255,80,80,0.2);
  border: 1px solid rgba(255,80,80,0.5);
  color: rgba(255,180,180,0.9);
  font-family: 'Libre Baskerville', serif;
  font-size: 11px; letter-spacing: 1px;
  padding: 5px 12px; cursor: pointer; border-radius: 1px;
}
#tune-copy-btn:hover { background: rgba(255,80,80,0.35); }
#tune-clear-btn {
  background: none;
  border: 1px solid rgba(255,80,80,0.25);
  color: rgba(255,120,120,0.5);
  font-family: 'Libre Baskerville', serif;
  font-size: 11px; padding: 5px 10px; cursor: pointer; border-radius: 1px;
  margin-right: 6px;
}
#tune-output {
  font-family: monospace;
  font-size: 12px;
  color: #a8d8a8;
  white-space: pre;
  line-height: 1.7;
  background: rgba(255,255,255,0.03);
  padding: 10px 12px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.06);
  min-height: 32px;
}
#tune-hint {
  margin-top: 8px;
  font-family: 'Libre Baskerville', serif;
  font-size: 10px; color: rgba(255,255,255,0.3);
  font-style: italic;
}

/* gear button: top-left, below location label */
#tune-toggle-btn {
  position: fixed; top: 68px; left: 22px;
  z-index: 400;
  background: rgba(10,8,6,0.6);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.22);
  font-size: 15px; line-height: 1;
  width: 30px; height: 30px;
  border-radius: 50%; cursor: pointer;
  transition: color 0.2s, background 0.2s;
  display: flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; width: 44px; height: 44px;
}
#tune-toggle-btn:hover,
#tune-toggle-btn.active { color: rgba(255,100,100,0.9); background: rgba(30,10,10,0.9); }

#tune-exit-btn {
  background: none; border: 1px solid rgba(255,255,255,0.3);
  color: #fff; font-family: 'Libre Baskerville', serif;
  font-size: 11px; padding: 2px 10px; cursor: pointer;
  border-radius: 1px; margin-left: 12px; vertical-align: middle;
}
#tune-scene {
  max-width: 190px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff; font-family: 'Libre Baskerville', serif;
  font-size: 11px; padding: 4px 6px; border-radius: 1px;
}
#tune-scene option { color: #000; }
@media (max-width: 600px) { #tune-scene { max-width: 110px; } }

/* HOTSPOTS THAT APPEAR LATER */
.hotspot.reveal { animation: hotspot-reveal 1.4s ease-out; }
@keyframes hotspot-reveal {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
  55%  { opacity: 1; transform: translate(-50%, -50%) scale(1.7); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* CARD DOORWAYS */
.card-goto-note {
  margin-top: 18px;
  font-size: 12px; font-style: italic;
  color: #7a5a38; line-height: 1.6;
  font-family: 'Libre Baskerville', serif;
}
.card-goto-note + .card-transition-btn { margin-top: 10px; }
.card-goto-locked {
  margin-top: 18px; padding: 9px 12px;
  border-left: 2px solid rgba(100,70,35,0.35);
  font-size: 12.5px; font-style: italic;
  color: #6a4828; line-height: 1.6;
  font-family: 'Libre Baskerville', serif;
}

/* FINAL REPORT, READY TO FILE */
.report-submit-btn:not(:disabled) {
  background: linear-gradient(180deg, #594618 0%, #382c0e 100%);
  border-color: #897035; color: #d4c4a0; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,215,100,0.1);
}
.report-submit-btn:not(:disabled):hover { background: linear-gradient(180deg, #6a5520 0%, #463a14 100%); }
.report-textarea[readonly] { background: rgba(255,255,255,0.22); }

/* ENDING */
#ending-overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  z-index: 140;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,0.74);
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s ease;
}
#ending-overlay.open { opacity: 1; pointer-events: all; }
#ending-card {
  position: relative;
  max-width: 600px; width: 100%;
  max-height: 100%; overflow-y: auto;
  padding: 28px 32px 26px; border-radius: 2px;
  background: radial-gradient(ellipse at 20% 0%, rgba(160,110,50,0.09) 0%, transparent 55%), #f3e9cc;
  box-shadow: 0 10px 50px rgba(0,0,0,0.65), 0 2px 8px rgba(0,0,0,0.4);
  color: #3a2a1a;
  font-family: 'Libre Baskerville', serif;
}
#ending-card::-webkit-scrollbar { width: 3px; }
#ending-card::-webkit-scrollbar-thumb { background: rgba(100,70,35,0.25); border-radius: 2px; }
.end-kicker {
  display: block; font-size: 9px; letter-spacing: 2.5px;
  text-transform: uppercase; color: #9a7850; margin-bottom: 7px;
}
.end-title {
  font-family: 'Cinzel', serif;
  font-size: 22px; font-weight: 700; color: #251508;
  line-height: 1.3; margin-bottom: 6px;
}
.end-head {
  font-family: 'Cinzel', serif;
  font-size: 15px; font-weight: 600; color: #251508;
  margin: 20px 0 8px; letter-spacing: 0.5px;
}
.end-p { font-size: 13.5px; line-height: 1.8; color: #3a2a1a; margin-bottom: 12px; white-space: pre-line; }
.end-p.quiet { font-size: 12px; font-style: italic; color: #7a5a38; }
.end-stamp {
  display: inline-block; margin: 4px 0 16px; padding: 6px 12px;
  border: 2px solid #7a1f16; color: #7a1f16;
  font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  transform: rotate(-2.5deg); opacity: 0.88;
}
.end-stamp.good { border-color: #2f4a33; color: #2f4a33; }
.end-names { margin: 6px 0 2px; border-top: 1px solid rgba(100,70,35,0.16); }
.end-name-row {
  display: flex; align-items: center; gap: 12px;
  padding: 7px 0; border-bottom: 1px solid rgba(100,70,35,0.16);
}
.end-name-info { flex: 1; min-width: 0; }
.end-name { font-size: 14px; color: #251508; }
.end-name-poi { font-size: 10.5px; font-style: italic; color: #8a6a48; margin-top: 2px; }
.end-toggle {
  flex-shrink: 0; min-height: 44px; min-width: 118px; padding: 8px 12px;
  background: transparent; border: 1px solid rgba(100,70,35,0.4); color: #6a4828;
  font-family: 'Libre Baskerville', serif; font-size: 10.5px;
  letter-spacing: 1.5px; text-transform: uppercase;
  cursor: pointer; border-radius: 1px;
  transition: background 0.18s, color 0.18s;
}
.end-toggle.on { background: #6b1d14; border-color: #4a120c; color: #f3e9cc; }
.end-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.end-actions > button { flex: 1 1 160px; margin-top: 0; }
.end-btn-secondary {
  min-height: 44px; padding: 12px 18px;
  background: transparent; border: 1px solid rgba(100,70,35,0.4); color: #5a3c20;
  font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 1px;
  cursor: pointer; border-radius: 1px;
}
.end-btn-secondary:hover { background: rgba(100,70,35,0.08); }
.end-item-title {
  font-family: 'Cinzel', serif;
  font-size: 14px; font-weight: 600; color: #251508; margin-bottom: 3px;
}
.end-q { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #8a6a48; margin-top: 12px; }
.end-a { font-size: 13px; line-height: 1.7; color: #251508; white-space: pre-wrap; word-wrap: break-word; }
.end-cat { padding: 10px 0; border-bottom: 1px solid rgba(100,70,35,0.16); }
.end-cat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.end-cat-title { font-family: 'Cinzel', serif; font-size: 14.5px; font-weight: 600; color: #251508; }
.end-cat-count { font-size: 11px; color: #8a6a48; white-space: nowrap; }
.end-cat-desc { font-size: 12.5px; line-height: 1.6; color: #4a3826; margin-top: 3px; }
.end-cat-found { font-size: 11.5px; font-style: italic; color: #4f6e4f; margin-top: 4px; line-height: 1.55; }
.end-cat-none { font-size: 11.5px; font-style: italic; color: #9a7850; margin-top: 4px; }
body.ending-mode .hotspot,
body.ending-mode #progress-btn,
body.ending-mode #tune-toggle-btn { display: none !important; }
body.ending-mode #card-overlay { z-index: 160; }
@media (min-width: 1000px) { #ending-overlay { right: 380px; } }
@media (max-width: 999px)  { #ending-overlay { padding-top: 66px; } }
@media (max-width: 500px) {
  #ending-card { padding: 22px 18px 20px; }
  .end-title { font-size: 18px; }
  .end-p { font-size: 13px; }
  .end-toggle { min-width: 104px; }
}

/* VERDICT CHOICES */
.end-verdicts { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.end-verdict {
  text-align: left; cursor: pointer; padding: 12px 14px;
  background: rgba(255,255,255,0.35); border: 1px solid rgba(100,70,35,0.3); border-radius: 2px;
  font-family: 'Libre Baskerville', serif; color: #251508; font-size: 14px; line-height: 1.5;
}
.end-verdict:hover { background: rgba(107,29,20,0.08); border-color: #6b1d14; }
.end-verdict small { display: block; font-size: 11px; font-style: italic; color: #8a6a48; margin-top: 3px; }
</style>
</head>

<script>
// =============================================================
// GAME DATA: add future scenes here; engine reads generically
// =============================================================
// Developer tools: the gear (tune mode and scene jumper) and the Skip to the Forum shortcut.
// Off for students. To turn them on, open the game with ?dev on the end of the address,
// e.g. index.html?dev (or index.html?dev&tune to start straight in tuning mode).
const DEV_TOOLS = /[?&]dev\b/.test(location.search);

// Every non-navigation hotspot has a kind: 'clue', 'ambiance', 'trivial', or 'herring'.
// Only clues count toward the case review; each herring carries a debunk shown there.
const GAME_DATA = {

  sceneOrder: ['nasica_atrium', 'forum_day', 'subura_insula', 'tiburtina_estate', 'gracchus_house',
               'vigil_night', 'fides_night'],

  scenes: {

    nasica_atrium: {
      id:       'nasica_atrium',
      name:     'House of Scipio Nasica',
      subtitle: 'The Palatine, Rome',
      actLabel: 'Act I - The Commission',
      image:    'art/nasica_atrium.jpg',

      hotspots: [
        { id:'lararium', label:'The Lararium', x:0.055, y:0.45, type:'object', kind:'ambiance', required:false,
          content:{ title:'The Lararium',
            text:"A little painted shrine by the door: the household gods, two dancing Lares with drinking horns, and a snake curling below them. A smear of fresh incense ash.\n\nYou were born a slave in this house. As a boy you swept this shrine every morning. Five years ago your master touched you with the rod before the praetor and said the words, and you walked out a free man wearing his family's name. You still sweep it, some mornings, out of habit." } },

        { id:'imagines', label:'The Ancestor Masks', x:0.190, y:0.30, type:'object', kind:'clue', required:false,
          content:{ title:'The Ancestor Masks',
            text:"Wax masks of the Cornelii Scipiones stare out of their painted cupboards, each one labelled with the offices its owner held. Consuls. Censors. Conquerors of Spain and Africa. In the middle, the face every Roman knows: Scipio Africanus, who beat Hannibal.\n\nAfricanus had two daughters, both named Cornelia. The elder was your master's mother. The younger is the mother of Tiberius Gracchus.\n\nThe man your patron wants destroyed is his own first cousin." } },

        { id:'nasica', label:'Scipio Nasica', x:0.310, y:0.52, type:'dialogue', kind:'clue', noPoi:true, required:true,
          content:{ title:'Publius Cornelius Scipio Nasica',
            desc:"Your patron. Former consul, Pontifex Maximus, chief priest of Rome. A tall man with a heavy jaw, who speaks as if every room were the Senate house.",
            lines:[
              "Sit. You have heard what my cousin has been doing. Tiberius Gracchus, tribune of the people, means to take the public land out of the hands of the men who have farmed it for three generations and give it away in little lots to the mob.",
              "Worse. When his colleague Octavius vetoed the law, as was his right, Tiberius had the Assembly vote him out of office. A sacred tribune, thrown off the Rostra like a drunk. Then King Attalus of Pergamum dies and leaves his kingdom to Rome, and Tiberius says the People will decide what to do with the money. Not the Senate. The People. Meaning himself.",
              "Now he means to stand for the tribunate a second year running. No man has ever done it. A man who removes his colleagues, spends the treasury, and refuses to leave office: the Romans have a word for that man. Rex. King.",
              "I need proof. Who stands behind him, what they intend, where they gather, when they mean to act. Go among them. You are a freedman with a fair hand; say you are a scribe looking for work. Bring me your report before the vote, and bring me names.",
              "You wear my family's name. Remember it."
            ] } },

        { id:'commission', label:'Your Commission', x:0.370, y:0.75, type:'document', kind:'clue', required:true,
          content:{ title:'Your Commission',
            text:"Two wax tablets bound with a cord, sealed with the Scipio ring.\n\nP. CORNELIUS SCIPIO NASICA TO HIS FREEDMAN, GREETING.\nInquire into Ti. Sempronius Gracchus, tribune of the plebs, and those around him. Learn whether he aims at regnum, at kingship over the Roman People. Learn who his men are and what they plan for the day of the vote. Report to me in writing before the Assembly meets on the Capitol.\n\nThe question is not whether he aims at kingship. It is written as though that were already settled." } },

        { id:'census_tablet', label:'The Census Tablet', x:0.230, y:0.74, type:'document', kind:'clue', required:false,
          content:{ title:'The Census Tablet',
            text:"A bronze-bound tablet on your patron's table, copied from the censors' records. Every five years the censors count the citizens who own enough to be enrolled.\n\nCitizens counted, 142 BC: 328,442.\nCitizens counted, 136 BC: 317,933.\n\nFewer every count, in years when Rome has conquered more than ever. Beneath, in your patron's hand: 'Gracchus will quote these. Answer: the men are idle, not poor.'\n\nOnly men with property could be called up for the legions. Fewer farmers meant fewer soldiers." } },

        { id:'pompeius', label:'Quintus Pompeius', x:0.585, y:0.53, type:'dialogue', kind:'herring', noPoi:true, required:false,
          debunk:"Quintus Pompeius really did tell the Senate that he lived next door to Tiberius and had seen the envoy from Pergamum hand him a royal diadem and a purple robe. Plutarch reports the charge. Nobody ever produced the diadem, and the chest that came from Pergamum held letters and a will. A story told often enough in the Senate starts to sound like evidence.",
          content:{ title:'Quintus Pompeius',
            desc:"A senator taking wine with your patron, a former consul himself, in a hurry to be heard.",
            lines:[
              "You are the freedman? Good. Then listen, because I will tell the Senate this myself. I live next door to Gracchus. I watch his door.",
              "When the envoy came from Pergamum with old Attalus' will, the envoy brought Tiberius gifts. A royal diadem. A purple robe. I saw the man carry in the chest with my own eyes.",
              "A diadem! What does a tribune of the plebs want with a diadem? Find it. Find me one slave who saw him try it on, and we are done with this."
            ] } },

        { id:'impluvium', label:'The Impluvium', x:0.470, y:0.88, type:'object', kind:'ambiance', required:false,
          content:{ title:'The Impluvium',
            text:"The shallow marble pool in the middle of the atrium catches the rain that falls through the opening in the roof. Today it holds only a square of summer sky and a few floating petals from the garden. A household's whole fortune can be read in its atrium. This one says: very old money." } },

        { id:'compluvium', label:'The Opening in the Roof', x:0.470, y:0.05, type:'object', kind:'ambiance', required:false,
          content:{ title:'The Opening in the Roof',
            text:"Through the square opening in the roof, a patch of hot blue sky. Swallows cut across it. Down in the valley, the noise of the Forum carries all the way up the Palatine: hawkers, hammering, a crowd cheering a speech you cannot quite hear." } },

        { id:'steward', label:'Hermon the Steward', x:0.735, y:0.55, type:'dialogue', kind:'clue', required:false,
          grants:['knows_estate'],
          content:{ title:'Hermon the Steward',
            desc:"Your patron's dispensator, a Greek slave who keeps the household's accounts. He was kind to you when you were small, and he still is.",
            lines:[
              "So he is sending you after the tribune. Be careful. Everyone in Rome is watching everyone else this summer.",
              "Do you know why the master hates this law so much? Come, you have seen the books. The estate on the Via Tiburtina, half a day out of the city. Most of it is public land, ager publicus. His grandfather took it up after the war with Hannibal, when the land lay empty, and the family has worked it ever since.",
              "The law would let him keep five hundred iugera and a little more for his sons. He holds a great deal more than that. More than nearly any man in Rome.",
              "If you want to understand what this is about, ride out the Via Tiburtina and look at it. Tell Damon, the overseer, that Hermon sent you."
            ] } },

        { id:'figs', label:'A Bowl of Figs', x:0.810, y:0.77, type:'object', kind:'trivial', required:false,
          content:{ title:'A Bowl of Figs',
            text:"Fresh figs on a silver dish. Old Cato once dropped a fig on the floor of the Senate and told the senators it had been picked in Carthage three days before. That was how close the enemy was, he said. Three years later Carthage was burned to the ground. These figs are from the master's own estate, and nobody has burned anything for them yet." } },

        { id:'satchel', label:'Your Satchel', x:0.905, y:0.87, type:'object', kind:'ambiance', required:false,
          content:{ title:'Your Satchel',
            text:"Everything you own that matters: a stylus, a set of blank wax tablets, a reed pen, a pot of ink, a few denarii, and the felt cap you were given the day you were freed. A freedman wears his patron's name for life. A good client comes when called, votes as he is told, and owes his patron his loyalty. Everyone knows the arrangement. It is how Rome works." } },

        { id:'daos', label:'Daos the Doorkeeper', x:0.955, y:0.65, type:'dialogue', kind:'ambiance', noPoi:true, required:false,
          content:{ title:'Daos the Doorkeeper',
            desc:"The old door slave, chained to his post by custom more than by iron. He grins at you.",
            lines:[
              "The master is waiting on you by the tablinum. Your tablets are on his table, by the pool.",
              "You can look around by dragging left and right. Touch anything that catches your eye: people, objects, documents. Everything you learn goes into your notebook.",
              "The golden lights are people and evidence. Those matter for your report. The pale blue lights are bits of everyday Roman life. Read them if you are curious, skip them if you are in a hurry."
            ] } },

        { id:'mirror', label:'A Bronze Mirror', x:0.110, y:0.78, type:'object', kind:'trivial', required:false,
          content:{ title:'A Bronze Mirror',
            text:"A polished bronze mirror on a stand. There are no glass mirrors yet, so your face looks back at you a little golden and blurry: clean-shaven, as Roman men are these days, hair cut short.\n\nEvery Roman citizen man has a name in three parts. A first name, like Publius. A family name, like Cornelius. And often a nickname that the family keeps, like Scipio, which means 'walking stick.' When you were freed, you took your master's first two names and kept your old slave name on the end. Publius Cornelius, and then the name your mother gave you.\n\nGirls get only the family name. Every daughter of the Cornelii is Cornelia. If there are three, they are numbered." } },

        { id:'phoebe', label:'The Old Nurse', x:0.655, y:0.58, type:'dialogue', kind:'ambiance', noPoi:true, required:false,
          content:{ title:'Phoebe the Nurse',
            desc:"An old slave woman folding linen at a chest. She is the nurse who raised half the children of this house, you among them.",
            lines:[
              "Look at you, in a citizen's toga. I remember you in nothing but a tunic and a scraped knee.",
              "The toga is for citizens only, you know. A slave may not wear one, and a foreigner may not. White wool, and heavy, and you need someone to help you put it on. The senators have a purple stripe on theirs, so you know who to step aside for.",
              "When a freeborn boy is born, they hang a bulla round his neck, a little gold locket against the evil eye. He wears it until he is about sixteen, then puts on the plain white toga of a man. A girl wears a little moon charm, and takes it off the night before she marries.",
              "Marries at fourteen, mostly. The master's daughter was promised at twelve. Then she goes from her father's house to her husband's, and if she is a good matron she holds the keys to the whole household.",
              "Women cannot vote or sit in the Senate. But do not believe anyone who tells you we have no say in Rome. Who do you think the senators go home and talk to at night?"
            ] } },

        { id:'loom', label:'The Loom', x:0.855, y:0.45, type:'object', kind:'trivial', required:false,
          content:{ title:'The Loom',
            text:"A tall upright loom stands in the atrium, where every visitor can see it. Clay weights hang from the threads to keep them tight. In the old families the lady of the house still weaves here, or at least makes sure she is seen to.\n\nEvery Roman knows what a good woman's gravestone should say. One carved in Rome in these very years, for a woman named Claudia, ends like this: 'She loved her husband with all her heart. She bore two sons. She was charming in speech and graceful in her walk. She kept the house. She worked wool.'" } },

        { id:'skip_to_forum', label:'Skip to the Forum', x:0.92, y:0.12, type:'navigation', goto:'forum_day', dev:true }
      ],

      progression: {
        required:   ['nasica', 'commission'],
